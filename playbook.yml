---
# ============================================================================
# playbook-for-ubuntu-devops-laptop
#
# Установка DevOps-окружения на локальный ноутбук с Ubuntu 26.04 (resolute).
#
# Запуск (пароль sudo вводит сам пользователь):
#   ansible-playbook -K playbook.yml
#
# Структура — стандартная для Ansible-проекта:
#   ansible.cfg        — настройки (инвентарь, путь к ролям)
#   inventory/         — инвентарь (localhost, локальное подключение)
#   group_vars/all.yml — общие переменные
#   roles/             — роли по доменам
#
# Версии инструментов не фиксируются: ставится актуальное на момент запуска.
# ============================================================================
- name: DevOps-окружение на Ubuntu-ноутбуке
  hosts: localhost
  gather_facts: true
  become: false          # системные шаги включают become: true внутри ролей
  any_errors_fatal: true

  roles:
    # base ставится всегда (нужен для --tags): базовые пакеты и каталоги.
    - role: base
      tags: [base, always]
    - role: git
      tags: [git]
    - role: docker
      tags: [docker]
    - role: kubernetes
      tags: [kubernetes]
    - role: iac
      tags: [iac]
    - role: postgres
      tags: [postgres]
    - role: runtimes
      tags: [runtimes]
    - role: secrets
      tags: [secrets]
    - role: shell
      tags: [shell]
    - role: network
      tags: [network]
    - role: ebpf
      tags: [ebpf]
    - role: opencode
      tags: [opencode]
    - role: ai_tools
      tags: [ai-tools]
    - role: skills
      tags: [skills]
    - role: audio
      tags: [audio]
    - role: guardrails
      tags: [guardrails]
    - role: nora
      tags: [nora]

  post_tasks:
    - name: Проверить работу установленных утилит
      ansible.builtin.command: "{{ item }}"
      register: verify_result
      changed_when: false
      failed_when: false
      loop:
        - "{{ bin_dir }}/yq --version"
        - "{{ bin_dir }}/gh --version"
        - "{{ bin_dir }}/glab --version"
        - "{{ bin_dir }}/kubectl version --client"
        - "{{ bin_dir }}/helm version --short"
        - "{{ bin_dir }}/kustomize version"
        - "{{ bin_dir }}/k9s version -s"
        - "{{ bin_dir }}/flux --version"
        - "{{ bin_dir }}/flux9s --version"
        - "{{ bin_dir }}/stern --version"
        - "{{ bin_dir }}/tflint --version"
        - "{{ bin_dir }}/terraform-docs --version"
        - "{{ bin_dir }}/packer version"
        - "{{ bin_dir }}/driftctl version"
        - "{{ bin_dir }}/s5cmd version"
        - "{{ bin_dir }}/vault version"
        - "{{ bin_dir }}/gitleaks version"
        - "{{ bin_dir }}/uv --version"
        - "{{ bin_dir }}/opencode --version"
        - "{{ bin_dir }}/herdr --version"
        - "{{ bin_dir }}/rtk --version"
        - "{{ bin_dir }}/bat --version"
        - "{{ bin_dir }}/starship --version"
        - "{{ bin_dir }}/glci version"
        - "{{ bin_dir }}/pre-commit --version"
        - "{{ bin_dir }}/reposcan version"
        - "{{ bin_dir }}/flate --version"
        - "{{ bin_dir }}/flux-tools --version"
        - "{{ bin_dir }}/cty version"
        - "{{ bin_dir }}/diffyml --version"
        - "{{ bin_dir }}/kubectl-k8i --version"
        - "{{ bin_dir }}/kubespy version"
        - "{{ bin_dir }}/kubecolor version --client"
        - "{{ bin_dir }}/kube-capacity version"
        - "{{ bin_dir }}/ktop --help"
        - "{{ bin_dir }}/kubefetch --version"
        - "{{ bin_dir }}/krew version"
        - "{{ bin_dir }}/view-secret --version"
        - "{{ bin_dir }}/df-pv --help"
        - "{{ bin_dir }}/browse-pvc --help"
        - "{{ bin_dir }}/pluto version"
        - "{{ bin_dir }}/pv-migrate --version"
        - "{{ bin_dir }}/marvin --version"
        - "{{ bin_dir }}/tgsieve --version"
        - "{{ bin_dir }}/pgcenter --version"
        - "{{ bin_dir }}/gai --version"
        - "{{ bin_dir }}/dnsglobe --version"
        - "{{ bin_dir }}/bandwhich --version"
        - "{{ bin_dir }}/q --version"
        - "{{ bin_dir }}/xh --version"
        - "{{ bin_dir }}/kyanos --version"
        - "{{ bin_dir }}/eget --version"
        - "{{ bin_dir }}/hurl --version"
        - "{{ bin_dir }}/sshx --version"
        - "{{ bin_dir }}/dust --version"
        - "{{ bin_dir }}/kftui --version"
        - "{{ bin_dir }}/ct version"
        - "{{ bin_dir }}/difftastic --version"
        - "{{ bin_dir }}/delta --version"
        - "{{ bin_dir }}/gdu --version"
        - "{{ bin_dir }}/dasel --version"
        - "{{ bin_dir }}/jc --version"
        - "{{ bin_dir }}/sd --version"
        - "shellcheck --version"
        - "{{ bin_dir }}/trippy --version"
        - "{{ bin_dir }}/tcping -v"
        - "{{ bin_dir }}/doggo --version"
        - "{{ bin_dir }}/ecapture --version"
        - "{{ bin_dir }}/termshark -v"
        - "{{ bin_dir }}/websocat --version"
        - "{{ bin_dir }}/zellij --version"
        - "{{ bin_dir }}/pwru --version"
        - "{{ bin_dir }}/bpftop --version"
        - "{{ bin_dir }}/oryx --version"
        - "{{ bin_dir }}/pktstat-bpf --version"
        - "{{ bin_dir }}/tracee version"
        - "{{ bin_dir }}/navi --version"
        - "{{ bin_dir }}/fx --version"
        - "{{ bin_dir }}/hl --version"
        - "{{ bin_dir }}/mcfly --version"
        - "{{ bin_dir }}/lf -version"
        - "{{ bin_dir }}/gomplate --version"
        - "{{ bin_dir }}/yamlfmt -version"
        - "{{ bin_dir }}/gum --version"
        - "{{ bin_dir }}/fastfetch --version"
        - "{{ bin_dir }}/procs --version"
        - "{{ bin_dir }}/oras version"
        - "{{ bin_dir }}/cheat --version"
        - "{{ bin_dir }}/tldr --version"
        - "{{ bin_dir }}/gotty --version"
        - "osqueryi --version"
        - "{{ bin_dir }}/lazygit --version"
        - "{{ bin_dir }}/lazydocker --version"
        - "{{ bin_dir }}/dive --version"
        - "{{ bin_dir }}/ctop -v"
        - "{{ bin_dir }}/sops --version"
        - "{{ bin_dir }}/grype version"
        - "ansible-lint --version"
        - "{{ pipx_bin_dir }}/molecule --version"
        - "mcommander --version"
        - "docker --version"
        - "docker compose version"
        - "{{ home_dir }}/.tfenv/bin/tfenv --version"
        - "{{ home_dir }}/.tgenv/bin/tgenv --version"
      loop_control:
        label: "{{ item }}"

    - name: Проверить наличие kubectx, gitlabcloner, rkn-check, showcert, headlamp и hushmic
      ansible.builtin.stat:
        path: "{{ item }}"
      register: extra_binaries_check
      failed_when: not extra_binaries_check.stat.exists
      loop:
        - "{{ bin_dir }}/kubectx"
        - "{{ bin_dir }}/gitlabcloner"
        - "{{ pipx_bin_dir }}/rkn-check"
        - "{{ pipx_bin_dir }}/showcert"
        - /opt/Headlamp/headlamp
        - /usr/bin/hushmic
      loop_control:
        label: "{{ item }}"

    # --- Удаление pitwall ----------------------------------------------------
    # pitwall не используется (issue о вводе русских букв:
    # https://github.com/quanticstudios/pitwall/issues/127). Удаляем бинарник,
    # ярлык, иконку, конфиг и состояние, чтобы не плодить мёртвый инструмент.
    - name: Остановить демон pitwall, если запущен
      ansible.builtin.command: "{{ bin_dir }}/pitwall daemon stop"
      register: pitwall_daemon_stop
      changed_when: false
      failed_when: false

    - name: Удалить файлы pitwall
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bin_dir }}/pitwall"
        - /usr/share/applications/pitwall.desktop
        - /usr/share/icons/hicolor/scalable/apps/pitwall.svg
        - /usr/share/icons/hicolor/scalable/apps/pitwall.png
        - /usr/share/icons/hicolor/48x48/apps/pitwall.png
        - /usr/share/icons/hicolor/256x256/apps/pitwall.png
      loop_control:
        label: "{{ item }}"

    - name: Удалить каталоги конфига и состояния pitwall
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ home_dir }}/.config/pitwall"
        - "{{ home_dir }}/.local/state/pitwall"
      loop_control:
        label: "{{ item }}"

    - name: Удалить сокет pitwall из XDG_RUNTIME_DIR
      ansible.builtin.file:
        path: "{{ ansible_facts['env'].get('XDG_RUNTIME_DIR', '') }}/pitwall"
        state: absent
      when: ansible_facts['env'].get('XDG_RUNTIME_DIR', '') | length > 0

    - name: Обновить кэш иконок после удаления pitwall
      become: true
      ansible.builtin.command: gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor
      changed_when: false
      failed_when: false

    - name: Итог — версии установленных утилит
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} ->
          {{ (item.stdout_lines | default([]) | join(' '))
             or (item.stderr_lines | default([]) | join(' '))
             or 'НЕ РАБОТАЕТ' }}
      loop: "{{ verify_result.results }}"
      loop_control:
        label: "{{ item.item }}"
