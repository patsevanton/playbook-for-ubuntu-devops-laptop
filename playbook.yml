    # --- Удаление pitwall ----------------------------------------------------
    # pitwall не используется (issue о вводе русских букв:
    # https://github.com/quanticstudios/pitwall/issues/127). Удаляем бинарник,
    # ярлык, иконку, конфиг и состояние, чтобы не плодить мёртвый инструмент.
    - name: Остановить демон pitwall, если запущен
      ansible.builtin.command: "{{ bin_dir }}/pitwall daemon stop"
      register: pitwall_daemon_stop
      changed_when: false
      failed_when: false

    - name: Удалить файлы pitwall
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bin_dir }}/pitwall"
        - /usr/share/applications/pitwall.desktop
        - /usr/share/icons/hicolor/scalable/apps/pitwall.svg
        - /usr/share/icons/hicolor/scalable/apps/pitwall.png
        - /usr/share/icons/hicolor/48x48/apps/pitwall.png
        - /usr/share/icons/hicolor/256x256/apps/pitwall.png
      loop_control:
        label: "{{ item }}"

    - name: Удалить каталоги конфига и состояния pitwall
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ home_dir }}/.config/pitwall"
        - "{{ home_dir }}/.local/state/pitwall"
      loop_control:
        label: "{{ item }}"

    - name: Удалить сокет pitwall из XDG_RUNTIME_DIR
      ansible.builtin.file:
        path: "{{ ansible_facts['env'].get('XDG_RUNTIME_DIR', '') }}/pitwall"
        state: absent
      when: ansible_facts['env'].get('XDG_RUNTIME_DIR', '') | length > 0

    - name: Обновить кэш иконок после удаления pitwall
      become: true
      ansible.builtin.command: gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor
      changed_when: false
      failed_when: false

    # --- Удаление утилит, от которых отказались -----------------------------
    # Причина отказов — в not-install.md: VictoriaMetrics (кроме
    # vmalert-tool) не нужна без локального скрейпа метрик, auto-cpufreq —
    # не нужен. Чистим всё, что могло остаться от промежуточных прогонов
    # плейбука или ручной установки, чтобы не плодить мёртвые инструменты.

    # VictoriaMetrics: single-node бинарник (стоял в ранней версии роли
    # monitoring) и каталог данных, который VM создаёт при запуске.
    - name: Удалить бинарник victoria-metrics (оставили только vmalert-tool)
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ bin_dir }}/victoria-metrics"
        - "{{ home_dir }}/victoria-metrics-data"
      loop_control:
        label: "{{ item }}"

    # auto-cpufreq: удаляем pipx-окружение (шим + venv). `pipx uninstall`
    # завершается с кодом 1 и печатает «Nothing to uninstall», если пакета нет —
    # это норма для идемпотентного прогона, поэтому не считаем ошибкой.
    - name: Удалить pipx-окружение auto-cpufreq (не нужен)
      ansible.builtin.command:
        cmd: "{{ pipx_executable }} uninstall auto-cpufreq"
      environment:
        PIPX_HOME: "{{ pipx_home }}"
        PIPX_BIN_DIR: "{{ pipx_bin_dir }}"
        PIPX_DEFAULT_PYTHON: "{{ pipx_python }}"
      register: autocpufreq_uninstall
      failed_when: false
      changed_when: >-
        autocpufreq_uninstall.rc == 0

    # Конфиг и systemd-юнит создаёт `auto-cpufreq --install` при ручной
    # установке сервиса — убираем и их, чтобы не оставалось хвостов.
    - name: Удалить файлы auto-cpufreq
      become: true
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ pipx_bin_dir }}/auto-cpufreq"
        - /etc/auto-cpufreq.conf
        - /etc/systemd/system/auto-cpufreq.service
      loop_control:
        label: "{{ item }}"

    - name: Итог — версии установленных утилит
      ansible.builtin.debug:
        msg: >-
          {{ item.item }} ->
          {{ (item.stdout_lines | default([]) | join(' '))
             or (item.stderr_lines | default([]) | join(' '))
             or 'НЕ РАБОТАЕТ' }}
      loop: "{{ verify_result.results }}"
      loop_control:
        label: "{{ item.item }}"
