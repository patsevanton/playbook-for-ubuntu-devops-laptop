---
# ============================================================================
# playbook-for-ubuntu-devops-laptop
#
# Установка DevOps-окружения на локальный ноутбук с Ubuntu 26.04 (resolute).
#
# Запуск (пароль sudo вводит сам пользователь):
#   ansible-playbook -K playbook.yml
#
# Структура — стандартная для Ansible-проекта:
#   ansible.cfg        — настройки (инвентарь, путь к ролям)
#   inventory/         — инвентарь (localhost, локальное подключение)
#   group_vars/all.yml — общие переменные
#   roles/             — роли по доменам
#
# Версии инструментов не фиксируются: ставится актуальное на момент запуска.
# ============================================================================
- name: DevOps-окружение на Ubuntu-ноутбуке
  hosts: localhost
  gather_facts: true
  become: false          # системные шаги включают become: true внутри ролей
  any_errors_fatal: true

  roles:
    # base ставится всегда (нужен для --tags): базовые пакеты и каталоги.
    - role: base
      tags: [base, always]
    - role: git
      tags: [git]
    - role: docker
      tags: [docker]
    - role: kubernetes
      tags: [kubernetes]
    - role: iac
      tags: [iac]
    - role: postgres
      tags: [postgres]
    - role: runtimes
      tags: [runtimes]
    - role: secrets
      tags: [secrets]
    - role: shell
      tags: [shell]
    - role: network
      tags: [network]
    - role: ebpf
      tags: [ebpf]
    - role: opencode
      tags: [opencode]
    - role: ai_tools
      tags: [ai-tools]
    - role: skills
      tags: [skills]
    - role: audio
      tags: [audio]
    - role: hardware
      tags: [hardware]
    - role: guardrails
      tags: [guardrails]
    - role: nora
      tags: [nora]
    - role: monitoring
      tags: [monitoring]

