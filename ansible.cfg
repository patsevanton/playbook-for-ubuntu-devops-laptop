# Конфигурация Ansible для этого проекта.
#
# Запуск (пароль sudo вводит сам пользователь):
#   ansible-playbook -K playbook.yml

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
host_key_checking = False

[privilege_escalation]
# Плейбук работает от обычного пользователя; root включается точечно
# (become: true на системных задачах внутри ролей). Пароль sudo спрашивается
# интерактивно — как через -K, так и по этой настройке.
become = False
become_ask_pass = True
# Ubuntu 26.04 использует sudo-rs, а ansible-core 2.20.x (из apt) ещё не умеет
# распознавать его приглашение «[sudo: ...] Password:» — задачи с become
# зависают и падают с «Timed out waiting for become success or become password
# prompt» (upstream: ansible/ansible#85837, фикс вышел после 2.20.1).
# Поэтому явно берём классический sudo.ws, который остаётся установленным как
# запасной вариант. Настройку можно убрать после обновления ansible-core до
# версии с поддержкой sudo-rs.
become_exe = /usr/bin/sudo.ws
