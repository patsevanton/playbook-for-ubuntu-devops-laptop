# Конфигурация Ansible для этого проекта.
#
# Запуск (пароль sudo вводит сам пользователь):
#   ansible-playbook -K playbook.yml

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
host_key_checking = False

[privilege_escalation]
# Плейбук работает от обычного пользователя; root включается точечно
# (become: true на системных задачах внутри ролей). Пароль sudo спрашивается
# интерактивно — как через -K, так и по этой настройке.
become = False
become_ask_pass = True
