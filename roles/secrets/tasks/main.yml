---
# ============================================================================
# Роль secrets: direnv (окружение по каталогам) и Vault.
# ============================================================================

- name: Установить direnv
  become: true
  ansible.builtin.apt:
    name: "{{ secrets_packages }}"
    state: present

- name: Установить Vault (актуальная версия)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ secrets_binaries }}"

- name: Установить Go-приложения для поиска секретов (entropy)
  ansible.builtin.include_role:
    name: go_apps
  vars:
    go_apps: "{{ secrets_go_apps }}"

- name: Установить osquery (SQL-подобная инструментация ОС)
  ansible.builtin.include_tasks:
    file: osquery.yml
  when: osquery_install

- name: Установить dependency-check (OWASP SCA)
  ansible.builtin.include_tasks:
    file: dependency-check.yml
  when: dependency_check_install
