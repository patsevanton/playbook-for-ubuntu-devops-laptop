---
# ============================================================================
# dependency-check (OWASP SCA) — поиск уязвимых зависимостей проекта.
#
# Апстрим публикует только zip-архив dependency-check-<ver>-release.zip:
# внутри каталог dependency-check/ с bin/dependency-check.sh и lib/*.jar.
# Поэтому ставим не через роль binaries: распаковываем в /opt/dependency-check,
# а в bin_dir кладём обёртку. Обёртка добавляет --data в ~/.cache/dependency-check
# (XDG), иначе обновление базы NVD обычным пользователем не сможет писать в /opt.
#
# Версия берётся из редиректа releases/latest (без GitHub API).
# Идемпотентность: есть исполняемый скрипт в /opt — ничего не делаем.
# ============================================================================

- name: Проверить, установлен ли dependency-check
  ansible.builtin.stat:
    path: "{{ dependency_check_dir }}/bin/dependency-check.sh"
  register: dependency_check_installed

- name: Установить dependency-check
  when: not dependency_check_installed.stat.exists
  block:
    - name: Узнать тег последнего релиза dependency-check (через редирект releases/latest)
      ansible.builtin.uri:
        url: "https://github.com/{{ dependency_check_repo }}/releases/latest"
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: dependency_check_release
      changed_when: false

    - name: Определить версию dependency-check
      ansible.builtin.set_fact:
        dependency_check_tag: "{{ dependency_check_release.location | regex_replace('^.*/releases/tag/', '') }}"
        dependency_check_version: >-
          {{ dependency_check_release.location | regex_replace('^.*/releases/tag/', '')
             | regex_replace('^v', '') }}

    - name: Создать каталог для архива dependency-check
      become: true
      ansible.builtin.file:
        path: "{{ dependency_check_zip_dir }}"
        state: directory
        mode: "0755"

    # Имя артефакта: dependency-check-13.0.0-release.zip.
    - name: Скачать архив dependency-check
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/{{ dependency_check_repo }}/releases/download/\
          {{ dependency_check_tag }}/dependency-check-\
          {{ dependency_check_version }}-release.zip"
        dest: "{{ dependency_check_zip_dir }}/dependency-check-{{ dependency_check_version }}-release.zip"
        mode: "0644"
        force: true

    # В zip лежит каталог dependency-check/ — распаковка в /opt создаёт
    # /opt/dependency-check целиком.
    - name: Распаковать dependency-check в /opt
      become: true
      ansible.builtin.unarchive:
        src: "{{ dependency_check_zip_dir }}/dependency-check-{{ dependency_check_version }}-release.zip"
        dest: /opt
        remote_src: true

    - name: Выставить права на скрипт запуска dependency-check
      become: true
      ansible.builtin.file:
        path: "{{ dependency_check_dir }}/bin/dependency-check.sh"
        mode: "0755"
        state: file

    - name: Положить обёртку dependency-check в bin_dir
      become: true
      ansible.builtin.copy:
        dest: "{{ dependency_check_bin }}"
        mode: "0755"
        content: |
          #!/bin/sh
          # dependency-check — Java-приложение в /opt. Добавляем --data в
          # пользовательский кэш, если он не задан явно: /opt принадлежит root,
          # и обновление базы NVD обычным пользователем иначе не работает.
          for arg in "$@"; do
            if [ "$arg" = "--data" ]; then
              exec {{ dependency_check_dir }}/bin/dependency-check.sh "$@"
            fi
          done
          exec {{ dependency_check_dir }}/bin/dependency-check.sh \
            --data "${XDG_CACHE_HOME:-$HOME/.cache}/dependency-check" "$@"

    - name: Удалить скачанный архив dependency-check
      become: true
      ansible.builtin.file:
        path: "{{ dependency_check_zip_dir }}"
        state: absent
