---
# ============================================================================
# osquery — SQL-подобная инструментация и мониторинг ОС: опрашивает
# процессы, файлы, сеть, пакеты, аудит-события таблицами через SQL
# (`osqueryi` интерактивно, `osqueryd` как демон).
#
# Ставится официальным .deb из GitHub-релиза (для Ubuntu — только .deb,
# rpm/tar.gz — под RHEL и macOS). Пакет кладёт бинарники в /opt/osquery/bin
# с симлинками osqueryd/osqueryi/osqueryctl в /usr/bin, а также systemd-юнит.
# Сервис не запускаем: без /etc/osquery/osquery.conf демон всё равно не
# поднимется, поэтому автозагрузку не меняем и дефолты не ломаем.
#
# Тег последнего релиза берётся из HTTP-редиректа releases/latest (без
# GitHub API — по образцу headlamp.yml/sniffnet.yml).
#
# Идемпотентность: если пакет osquery уже установлен — ничего не делаем.
# ============================================================================

- name: Проверить, установлен ли osquery
  ansible.builtin.stat:
    path: /usr/bin/osqueryi
  register: osquery_installed

- name: Установить osquery
  when: not osquery_installed.stat.exists
  block:
    - name: Узнать тег последнего релиза osquery (через редирект releases/latest)
      ansible.builtin.uri:
        url: "https://github.com/{{ osquery_repo }}/releases/latest"
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: osquery_release
      changed_when: false

    - name: Определить версию osquery
      ansible.builtin.set_fact:
        osquery_tag: "{{ osquery_release.location | regex_replace('^.*/releases/tag/', '') }}"
        osquery_version: >-
          {{ osquery_release.location | regex_replace('^.*/releases/tag/', '')
             | regex_replace('^v', '') }}

    - name: Создать каталог для .deb osquery
      become: true
      ansible.builtin.file:
        path: "{{ osquery_deb_dir }}"
        state: directory
        mode: "0755"

    # Имя артефакта: osquery_5.23.1-1.linux_amd64.deb (версия без префикса v).
    - name: Скачать .deb-пакет osquery
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/{{ osquery_repo }}/releases/download/{{ osquery_tag }}/osquery_{{ osquery_version }}-1.linux_amd64.deb"
        dest: "{{ osquery_deb_dir }}/osquery_{{ osquery_version }}-1.linux_amd64.deb"
        mode: "0644"
        force: true

    - name: Установить osquery из .deb
      become: true
      ansible.builtin.apt:
        deb: "{{ osquery_deb_dir }}/osquery_{{ osquery_version }}-1.linux_amd64.deb"
      register: osquery_install_result
      retries: 3
      delay: 5
      until: osquery_install_result is succeeded

    - name: Удалить временный .deb osquery
      become: true
      ansible.builtin.file:
        path: "{{ osquery_deb_dir }}"
        state: absent
