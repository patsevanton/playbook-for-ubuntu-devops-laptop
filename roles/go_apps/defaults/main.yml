---
# ============================================================================
# Роль go_apps — установка Go-приложений командой `go install <модуль>@latest`.
#
# Нужна для инструментов без готовых бинарников в релизах: собираем из
# исходников тем же Go, который ставит роль runtimes (golang-go). Поэтому роль
# вызывается только из ролей, идущих в плейбуке после runtimes
# (secrets, monitoring).
#
# Роль не тянет конкретные приложения сама: её вызывают другие роли через
# include_role и передают список go_apps. Поля элемента:
#
#   name    — имя файла в {{ bin_dir }};
#   package — путь Go-модуля (github.com/owner/repo[/vN]).
#
# Идемпотентность: бинарник ставится, только если его нет в bin_dir.
# Версия не фиксируется: @latest берёт последний тег модуля.
# ============================================================================

# Список задаёт вызывающая роль; значение по умолчанию — пустой список.
go_apps: []

# go — системный бинарник из пакета golang-go (роль runtimes).
go_executable: /usr/bin/go

# Каталоги кэша и модулей: держим их в tmp_dir. Запуск идёт с become (bin_dir
# принадлежит root), иначе кэш и модули осели бы в /root/.cache и /root/go.
go_apps_cache_dir: "{{ tmp_dir }}/go-cache"
go_apps_path_dir: "{{ tmp_dir }}/go-path"
