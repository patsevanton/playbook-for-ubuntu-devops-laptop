---
# ============================================================================
# Роль binaries — движок установки бинарников в {{ bin_dir }}.
#
# Роль не тянет конкретные инструменты сама: её вызывают другие роли
# (kubernetes, iac, secrets, shell) через include_role и передают список
# binaries_to_install. Поля элемента списка:
#
#   name          — имя файла в {{ bin_dir }}
#   source        — github | text
#   repo          — owner/repo на GitHub        (source=github)
#   version_url   — URL, отдающий версию текстом (source=text)
#   version_strip — regex, срезающий префикс тега (по умолчанию ^v)
#   url           — шаблон ссылки на файл; подставляются {tag} и {version}
#   archive       — none | tar | zip
#   member        — путь к бинарнику внутри архива (можно {tag} и {version})
#
# Идемпотентность: бинарник ставится, только если его нет в bin_dir.
# Удалить файл = переустановить при следующем запуске.
#
# Версия определяется без GitHub API (у него лимит 60 запросов в час):
#   source=github -> тег последнего релиза берётся из HTTP-редиректа
#                    https://github.com/<repo>/releases/latest
#   source=text   -> версия читается из текстового endpoint'а
#                    (dl.k8s.io/release/stable.txt, get.helm.sh/...)
# ============================================================================

# Список задаёт вызывающая роль; значение по умолчанию — пустой список.
binaries_to_install: []
