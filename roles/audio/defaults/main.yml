---
# ============================================================================
# Роль audio: HushMic — шумоподавление микрофона реального времени.
#
# HushMic добавляет в PipeWire виртуальный микрофон, который на лету убирает
# шум клавиатуры, вентиляторов и фоновые голоса (модель DPDFNet). В приложениях
# (Discord, OBS, браузер) выбирается устройство ввода «HushMic».
#
# Ставится официальным .deb-пакетом из GitHub-релиза: он раскладывает бинарник,
# LADSPA-плагин, модели, иконки и пользовательский systemd-юнит. Версии не
# фиксируются — тег последнего релиза берётся из HTTP-редиректа releases/latest
# (без GitHub API).
#
# Идемпотентность: если /usr/bin/hushmic уже есть — ничего не делаем.
# ============================================================================

# --- Пакеты, нужные HushMic (PipeWire + WirePlumber) ------------------------
audio_packages:
  - pipewire
  - pipewire-bin
  - pipewire-pulse
  - wireplumber
  - hicolor-icon-theme

audio_repo: Fovty/HushMic

audio_deb_dir: "{{ tmp_dir }}/hushmic"
