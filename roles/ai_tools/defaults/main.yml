---
# ============================================================================
# Роль ai-tools: CLI-инструменты, усиливающие AI-агентов (opencode и др.).
#
# herdr — TUI-оболочка поверх терминала: управляет сессиями/панелями/вкладками
#         coding-агентов. Одиночный статический бинарник (без архива).
# rtk   — прокси-обёртка над утилитами: сжимает и фильтрует вывод (логи, diff,
#         таблицы), прежде чем он попадёт в контекст LLM.
#
# Обе ставятся в {{ bin_dir }} через роль binaries (версия — актуальная на
# момент запуска, без GitHub API — через редирект releases/latest).
#
# Интеграции с opencode:
#   herdr integration install opencode — herdr-agent-state.js, herdr-tui-session.js,
#                                         tui.jsonc, herdr-opencode/tui.js.
#   rtk init -g --opencode                — plugins/rtk.ts (перехват tool.execute.before).
#
# Конфиги:
#   herdr — статичный files/herdr/config.toml (onboarding выключен, тосты
#           через сам herdr; телеметрии у herdr в конфиге нет).
#   rtk   — генерируется динамически: rtk config --create даёт актуальный
#           дефолт (схема может меняться между версиями), затем
#           rtk telemetry disable выключает телеметрию и фиксирует отказ от
#           согласия (consent: no). Файл не храним в files/, чтобы не
#           захардкодить устаревшую схему.
# ============================================================================
herdr_config_dir: "{{ home_dir }}/.config/herdr"
herdr_config_file: "{{ herdr_config_dir }}/config.toml"
rtk_config_dir: "{{ home_dir }}/.config/rtk"
rtk_config_file: "{{ rtk_config_dir }}/config.toml"
# Каталог плагинов opencode — сюда интеграции кладут свои файлы
# (herdr-agent-state.js, rtk.ts).
opencode_plugins_dir: "{{ home_dir }}/.config/opencode/plugins"
# Побочные файлы от `rtk init -g --opencode` (Claude Code-специфика и шаблон
# фильтров) — opencode-плагину не нужны, удаляются после init.
rtk_claude_dir: "{{ home_dir }}/.claude"
rtk_filters_file: "{{ rtk_config_dir }}/filters.toml"
rtk_claude_side_effects:
  - "{{ rtk_claude_dir }}/CLAUDE.md"
  - "{{ rtk_claude_dir }}/RTK.md"
  - "{{ rtk_filters_file }}"

ai_tools_binaries:
  - name: herdr
    source: github
    repo: herdrdev/herdr
    url: "https://github.com/herdrdev/herdr/releases/download/{tag}/herdr-linux-x86_64"
    archive: none
  - name: rtk
    source: github
    repo: rtk-ai/rtk
    url: "https://github.com/rtk-ai/rtk/releases/download/{tag}/rtk-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: rtk

# --- T3 Code ----------------------------------------------------------------
# T3 Code — графический пульт к coding-агентам: один сервер на ноутбуке,
# к нему десктопное приложение (Electron), веб-клиент и мобильные приложения
# iOS/Android. Видит сессии Claude Code, Codex, Cursor, Grok Build, opencode и
# Google Antigravity, установленные и авторизованные локально, — выдаёт им
# задачи, показывает диффы и статус. Ставится официальным .deb из
# GitHub-релиза (T3-Code-{version}-amd64.deb): приложение в /opt, ярлык
# /usr/bin/t3code. CLI `t3` (headless-сервер, `t3 service install`, `t3 pair`
# для телефона) в .deb не входит — при необходимости ставится официальным
# install.sh с t3.codes; плейбук его не трогает.
t3code_install: true
t3code_repo: pingdotgg/t3code
t3code_deb_arch: amd64
t3code_bin: /usr/bin/t3code
t3code_deb_dir: "{{ tmp_dir }}/t3code"

# --- Ouroboros: AI-агент с десктопом, CLI и web-интерфейсом (.deb) -----------
# Самомодифицирующийся general-purpose агент: помнит контекст между задачами и
# перезапусками, ведёт рой суб-агентов, работает с внешними проектами, отдаёт
# те же задачи через CLI (`ouroboros run`, `tasks`, `schedule`) и web-интерфейс
# на 127.0.0.1:8765. Модели — свои API-ключи или локальная GGUF.
#
# Пакет крупный (~900 МБ), поэтому включён флагом: если агент не нужен,
# поставить `ouroboros_install: false`. Имя артефакта
# ouroboros_{version}_amd64.deb (версия без префикса v). Версия берётся из
# редиректа releases/latest (см. tasks/ouroboros.yml). Ставится в /opt,
# ярлык /usr/bin/ouroboros; systemd user unit пакет создаёт, но не включает.
ouroboros_install: true
ouroboros_repo: razzant/ouroboros
ouroboros_deb_dir: "{{ tmp_dir }}/ouroboros"

# --- Google Chrome: браузер для stealth-browser-mcp (deb) -------------------
# В Ubuntu 26.04 Chromium ставится только снапом: chromium-browser —
# переходник на snap, deb-пакета chromium в архиве нет. К тому же confinement
# снапа ограничивает доступ к профилю и DevToolsActivePort, поэтому
# CDP-подключение из nodriver там не гарантировано. Поэтому ставим Chrome
# официальным .deb с dl.google.com.
#
# Пакет сам подключает свой apt-репозиторий (google-chrome.sources + ключ
# /usr/share/keyrings/google-chrome.gpg): обновления Chrome дальше приходят
# обычным `apt upgrade`. Свои source-файлы плейбук не пишет — postinst Google
# удаляет legacy google-chrome.list, а две записи одного источника
# конфликтовали бы по Signed-By.
#
# .deb ~150 МБ; скачивается, только если /usr/bin/google-chrome ещё нет.
# Идемпотентность: есть бинарник — роль ничего не качает.
#
# Бинарник /usr/bin/google-chrome: stealth-browser-mcp ищет его первым
# (google-chrome, google-chrome-stable, chromium, …), поэтому
# STEALTH_BROWSER_EXECUTABLE для него не нужен.
#
# Не нужен браузер — google_chrome_install: false.
google_chrome_install: true
google_chrome_bin: /usr/bin/google-chrome
google_chrome_deb_url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
google_chrome_deb_dir: "{{ tmp_dir }}/google-chrome"

# --- stealth-browser-mcp: MCP-сервер браузера (pipx) ------------------------
# Браузерная автоматизация для AI-клиентов (opencode, Claude, Cursor):
# навигация, извлечение DOM, перехват сети, CDP-команды. Работает через
# nodriver — запускает настоящий Chrome/Chromium/Edge с профилем пользователя,
# поэтому проходит часть анти-бот-проверок, где палится Playwright.
#
# PyPI-пакет называется browserstealthmcp: имя stealth-browser-mcp на PyPI
# занято другим проектом и ставит не то. Шим в {{ pipx_bin_dir }} —
# stealth-browser-mcp. Ставится через pipx (роль pipx_apps), sudo не нужен.
# Идемпотентность: есть шим — не трогаем; обновление —
# `pipx upgrade browserstealthmcp`.
#
# Браузер ставит эта же роль (google_chrome_install выше); если нужен другой
# Chromium (например, Yandex), он задаётся переменной окружения
# STEALTH_BROWSER_EXECUTABLE в конфиге MCP-клиента:
#   "env": {"STEALTH_BROWSER_EXECUTABLE": "/usr/bin/yandex-browser"}
#
# В конфиг opencode (~/.config/opencode/opencode.json) сервер прописывается
# вручную, как kubectl-mcp-server из роли kubernetes:
#   "mcp": {
#     "stealth-browser": {
#       "type": "local",
#       "command": ["{{ stealth_browser_mcp_bin }}"],
#       "enabled": true
#     }
#   }
#
# Полный набор — 101 инструмент, флаг --minimal оставляет 21. HTTP-транспорт
# без STEALTH_BROWSER_MCP_AUTH_TOKEN наружу не выставлять: сервер даёт доступ
# к cookies, локальным файлам и CDP.
stealth_browser_mcp_install: true
stealth_browser_mcp_package: browserstealthmcp
stealth_browser_mcp_bin: "{{ pipx_bin_dir }}/stealth-browser-mcp"
