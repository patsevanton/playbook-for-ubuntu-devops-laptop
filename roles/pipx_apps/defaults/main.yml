---
# ============================================================================
# Роль pipx_apps — установка Python-приложений из PyPI через pipx.
#
# Нужна для инструментов, у которых нет готовых бинарников в релизах:
# pipx собирает их в изолированный venv, а шим кладёт в pipx_bin_dir
# (~/.local/bin, уже в PATH через devops-shell.sh). Поэтому sudo не нужен.
#
# Роль не тянет конкретные приложения сама: её вызывают другие роли
# (git, iac) через include_role и передают список pipx_apps. Поля элемента:
#
#   name    — имя пакета на PyPI;
#   creates — имя шима в pipx_bin_dir (проверка идемпотентности).
#
# Идемпотентность: есть шим — не трогаем (обновление = pipx upgrade <пакет>).
# ============================================================================

# Список задаёт вызывающая роль; значение по умолчанию — пустой список.
pipx_apps: []
