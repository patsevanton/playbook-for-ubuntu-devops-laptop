---
# ============================================================================
# Роль monitoring: локальная утилита проверки алерт-правил vmalert-tool.
# ============================================================================

- name: Установить vmalert-tool (актуальная версия)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ monitoring_binaries }}"

- name: Установить krr (рекомендации requests/limits)
  ansible.builtin.include_tasks:
    file: krr.yml
  when: krr_install
