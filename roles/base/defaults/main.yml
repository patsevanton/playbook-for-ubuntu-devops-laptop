---
# Базовые пакеты из репозитория Ubuntu.
# Версии не фиксируются: apt ставит актуальные для текущего релиза.
base_packages:
  - ca-certificates
  - curl
  - wget
  - git
  - jq
  - unzip
  - zip
  - tar
  - gzip
  - xz-utils
  - bash-completion
  - lsb-release
  # pipx — изолированные окружения для Python-приложений; ставится здесь,
  # а не в роли runtimes: molecule (ниже) ставится через pipx, а роль base
  # идёт первой в плейбуке (и всегда, см. tags: [base, always]).
  - pipx

# yq (процессор YAML/JSON) и eget (установщик бинарников из GitHub-релизов) —
# скачиваемые бинарники в /usr/local/bin. eget — мета-инструмент: ставит
# готовые бинарники из релизов, поэтому лежит в base вместе с прочей «базой».
base_binaries:
  - name: yq
    source: github
    repo: mikefarah/yq
    url: "https://github.com/mikefarah/yq/releases/download/{tag}/yq_linux_amd64"
    archive: none
  # eget — установка готовых бинарников прямо из GitHub-релизов (одна команда:
  # eget owner/repo). В архиве бинарник лежит в каталоге eget-{version}-linux_amd64.
  - name: eget
    source: github
    repo: zyedidia/eget
    url: "https://github.com/zyedidia/eget/releases/download/{tag}/eget-{version}-linux_amd64.tar.gz"
    archive: tar
    member: eget-{version}-linux_amd64/eget
  # dra — скачивание релизных ассетов GitHub по имени репозитория (dra download
  # owner/repo; можно выбрать ассет, распаковать и поставить права). Дополняет
  # eget: eget ставит бинарник «как есть», dra — забирает конкретные файлы
  # релиза. Тег релиза без префикса v (0.10.3), поэтому {tag} == {version};
  # бинарник лежит в каталоге dra-{version}-x86_64-unknown-linux-gnu.
  - name: dra
    source: github
    repo: devmatteini/dra
    url: "https://github.com/devmatteini/dra/releases/download/{tag}/dra-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: dra-{version}-x86_64-unknown-linux-gnu/dra

# molecule — фреймворк тестирования Ansible-ролей и плейбуков (прогон ролей
# в контейнерах/VM). Пакета в apt и релизных бинарников нет — ставится из PyPI
# через pipx в изолированное окружение (как rkn-block-checker в роли network),
# шим попадает в pipx_bin_dir (~/.local/bin уже в PATH через devops-shell.sh).
# molecule-plugins — драйверы сценариев; включаем extra docker, чтобы гонять
# тесты в контейнерах Docker (Engine ставится ролью docker).
molecule_pipx_name: molecule
molecule_pipx_inject: "molecule-plugins[docker]"
# Коллекции Ansible нужны самому драйверу docker: его сценарии molecule
# запускает модулями community.docker и ansible.posix. Ставятся в
# ~/.ansible/collections (общий каталог для apt- и pipx-версий ansible-core).
molecule_collections:
  - community.docker
  - ansible.posix
