---
# ============================================================================
# Роль iac: инструменты Infrastructure as Code.
#
# Внимание: сам terraform здесь НЕ ставится. Terraform и Terragrunt
# управляются через tfenv/tgenv (они ставятся ниже), а конкретные версии
# вы выбираете сами командой `tfenv use <версия>` — см. README.
# ============================================================================
iac_binaries:
  - name: tflint
    source: github
    repo: terraform-linters/tflint
    url: "https://github.com/terraform-linters/tflint/releases/download/{tag}/tflint_linux_amd64.zip"
    archive: zip
    member: tflint
  - name: terraform-docs
    source: github
    repo: terraform-docs/terraform-docs
    url: "https://github.com/terraform-docs/terraform-docs/releases/download/{tag}/terraform-docs-v{version}-linux-amd64.tar.gz"
    archive: tar
    member: terraform-docs
  - name: packer
    source: github
    repo: hashicorp/packer
    url: "https://releases.hashicorp.com/packer/{version}/packer_{version}_linux_amd64.zip"
    archive: zip
    member: packer
  - name: driftctl
    source: github
    repo: snyk/driftctl
    url: "https://github.com/snyk/driftctl/releases/download/{tag}/driftctl_linux_amd64"
    archive: none

tfenv_repo: https://github.com/tfutils/tfenv.git
tfenv_dir: "{{ home_dir }}/.tfenv"
tgenv_repo: https://github.com/tgenv/tgenv.git
tgenv_dir: "{{ home_dir }}/.tgenv"
