---
# ============================================================================
# Роль iac: tflint, terraform-docs, packer + менеджеры версий tfenv/tgenv.
# ============================================================================

- name: Установить инструменты IaC (актуальные версии)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ iac_binaries }}"

# tfenv/tgenv ставятся в домашний каталог пользователя, поэтому без become.
# Идемпотентность по наличию файла: нет бинарника — клонируем репозиторий.
- name: Проверить наличие tfenv
  ansible.builtin.stat:
    path: "{{ tfenv_dir }}/bin/tfenv"
  register: tfenv_stat

- name: Установить tfenv (менеджер версий Terraform)  # noqa: latest[git]
  ansible.builtin.git:
    repo: "{{ tfenv_repo }}"
    dest: "{{ tfenv_dir }}"
    version: HEAD
    depth: 1
  when: not tfenv_stat.stat.exists

- name: Проверить наличие tgenv
  ansible.builtin.stat:
    path: "{{ tgenv_dir }}/bin/tgenv"
  register: tgenv_stat

- name: Установить tgenv (менеджер версий Terragrunt)  # noqa: latest[git]
  ansible.builtin.git:
    repo: "{{ tgenv_repo }}"
    dest: "{{ tgenv_dir }}"
    version: HEAD
    depth: 1
  when: not tgenv_stat.stat.exists
