---
# Сетевые утилиты из репозитория Ubuntu.
network_packages:
  - nmap
  - netcat-openbsd
  - tcpdump
  - httpie
  - bind9-dnsutils
  - telnet
  # tshark — CLI Wireshark (нужен termshark как зависимость для разбора PCAP).
  - tshark

# rkn-block-checker — Python-CLI: разбирает, каким способом провайдер режет
# доступ (DNS-подмена, TCP reset, TLS DPI по SNI, заглушка провайдера).
# Диагностика по слоям: DNS, TCP, TLS, HTTP.
# showcert — «OpenSSL для людей»: человекочитаемый разбор X.509-сертификатов
# (тоже Python, ставится из PyPI). Оба ставятся через pipx в изолированное
# окружение (как и положено Python-приложениям).
network_pipx_apps:
  - name: rkn-block-checker
    creates: rkn-check
  - name: showcert
    creates: showcert
  # ssh-audit — аудит конфигурации SSH-серверов и клиентов: алгоритмы
  # key exchange/cipher/MAC, известные проблемы, рекомендации. Ставится из
  # PyPI в изолированное окружение pipx.
  - name: ssh-audit
    creates: ssh-audit
  # httptap — разбор HTTP-запроса по слоям: DNS, TCP connect, TLS-рукопожатие
  # и TTFB, без внешнего прокси. Удобно, когда непонятно, на каком этапе
  # запрос тормозит. Ставится из PyPI в изолированное окружение pipx.
  - name: httptap
    creates: httptap
  # dns-lexicon (команда lexicon) — единый способ управлять DNS-записями у
  # разных провайдеров (Cloudflare, Route53, DigitalOcean, Yandex и десятков
  # других): list/create/update/delete из CLI и из Ansible. Пакет на PyPI
  # называется dns-lexicon (пакет `lexicon` — это другая библиотека).
  - name: dns-lexicon
    creates: lexicon
  # netutils-linux — набор утилит для диагностики и тюнинга сетевого стека:
  # network-top (кто ест сеть по процессам/сокетам), softirq-top и
  # softnet-stat-top (распределение softirq по CPU), rps/autorps/autoxps
  # (раскладка очередей и RPS/XPS), rx-buffers-increase, link-rate,
  # pcap-tcp-stream, netdev-pci-speed. Ставится из PyPI (пакет на чистом
  # Python, без бинарников в релизах) в изолированное окружение pipx;
  # в PATH появляются сами команды, marker — network-top.
  - name: netutils-linux
    creates: network-top
  # posting — HTTP-клиент в терминале: коллекции запросов, окружения и
  # переменные, история и `.http`-файлы в одном TUI. Дополняет httpie и xh:
  # те закрывают разовые запросы, posting — повторяемые сценарии. Ставится
  # из PyPI в изолированное окружение pipx.
  - name: posting
    creates: posting

# Go-приложения без релизных бинарников — собираются ролью go_apps.
network_go_apps:
  # reachable — быстрая проверка доступности домена по резолверам
  # (A/AAAA/CNAME, цепочка прокси) и по HTTP: показывает код ответа, время и
  # расхождения между резолверами. Релизных ассетов апстрим не публикует,
  # поэтому ставим `go install`.
  - name: reachable
    package: github.com/italolelis/reachable

# Скачиваемые бинарники сетевой диагностики.
network_binaries:
  # gai — инспектор getaddrinfo: показывает реальный путь разрешения имени
  # (files/mDNS/systemd-resolved/DNS), который проходит ОС, и сверяет его с
  # независимым DNS-запросом, выявляя расхождения.
  - name: gai
    source: github
    repo: casablanque-code/gai
    url: "https://github.com/casablanque-code/gai/releases/download/{tag}/gai-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: gai
  # dnsglobe — TUI-проверка распространения DNS-записи: параллельно опрашивает
  # 34 публичных резолвера по миру и показывает расхождения и прогресс на карте.
  - name: dnsglobe
    source: github
    repo: 514-labs/dnsglobe
    url: "https://github.com/514-labs/dnsglobe/releases/download/{tag}/dnsglobe-x86_64-unknown-linux-gnu.tar.xz"
    archive: tarxz
    member: dnsglobe-x86_64-unknown-linux-gnu/dnsglobe
  # bandwhich — TUI текущей полосы трафика по процессам и соединениям. Для
  # чтения трафика требует CAP_NET_RAW — ниже на бинарник вешается setcap.
  - name: bandwhich
    source: github
    repo: imsnif/bandwhich
    url: "https://github.com/imsnif/bandwhich/releases/download/{tag}/bandwhich-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: bandwhich
  # q — крошечный DNS-клиент: UDP/TCP/DoH/DoT/DoQ/ODoH. В тарболле одиночный q.
  - name: q
    source: github
    repo: natesales/q
    url: "https://github.com/natesales/q/releases/download/{tag}/q_{version}_linux_amd64.tar.gz"
    archive: tar
    member: q
  # xh — быстрый HTTP-клиент (замена httpie). В архиве бинарник лежит в
  # каталоге xh-v{version}-x86_64-unknown-linux-musl.
  - name: xh
    source: github
    repo: ducaale/xh
    url: "https://github.com/ducaale/xh/releases/download/{tag}/xh-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: xh-v{version}-x86_64-unknown-linux-musl/xh
  # kyanos — анализ сетевых запросов через eBPF: латентность и payload (а не
  # просто байты). Релиз — kyanos_{version}_linux_amd64.tar.gz, бинарник kyanos.
  - name: kyanos
    source: github
    repo: hengyoush/kyanos
    url: "https://github.com/hengyoush/kyanos/releases/download/{tag}/kyanos_{version}_linux_amd64.tar.gz"
    archive: tar
    member: kyanos
  # hurl — запуск и тестирование HTTP-запросов из plain-text .hurl-файлов
  # (парсер и раннер в одном бинарнике; отдельно есть hurlfmt). Тег релиза без
  # префикса v (8.0.1), поэтому в URL подставляем {tag} и {version} одинаково.
  # В архиве бинарник лежит в каталоге hurl-<ver>-x86_64-unknown-linux-gnu/bin.
  - name: hurl
    source: github
    repo: Orange-OpenSource/hurl
    url: "https://github.com/Orange-OpenSource/hurl/releases/download/{tag}/hurl-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: hurl-{version}-x86_64-unknown-linux-gnu/bin/hurl
  # trippy — TUI traceroute с историей и статистикой по хопам. Тег релиза без
  # префикса v (0.13.0). Бинарник внутри называется trip — кладём под именем
  # trippy (как и называется инструмент), чтобы не путать с командой trip.
  - name: trippy
    source: github
    repo: fujiapple852/trippy
    url: "https://github.com/fujiapple852/trippy/releases/download/{tag}/trippy-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: trippy-{version}-x86_64-unknown-linux-gnu/trip
  # ecapture — захват TLS-трафика приложений без CA-сертификатов через eBPF
  # (SSL/TLS plaintext из зашифрованных соединений). Релиз —
  # ecapture-{tag}-linux-amd64.tar.gz, бинарник ecapture лежит в каталоге
  # ecapture-v{version}-linux-amd64/ архива (нужен eBPF — ядро с CONFIG_BPF).
  - name: ecapture
    source: github
    repo: gojue/ecapture
    url: "https://github.com/gojue/ecapture/releases/download/{tag}/ecapture-{tag}-linux-amd64.tar.gz"
    archive: tar
    member: ecapture-v{version}-linux-amd64/ecapture
  # termshark — TUI для Wireshark/tcpdump: удобный просмотр PCAP в терминале.
  # Требует tshark в рантайме (добавлен в network_packages). Релиз —
  # termshark_{version}_linux_x64.tar.gz, бинарник лежит в каталоге
  # termshark_{version}_linux_x64/ архива.
  - name: termshark
    source: github
    repo: gcla/termshark
    url: "https://github.com/gcla/termshark/releases/download/{tag}/termshark_{version}_linux_x64.tar.gz"
    archive: tar
    member: termshark_{version}_linux_x64/termshark
  # websocat — swiss-army knife для WebSocket: CLI-клиент/сервер, проброс,
  # тестирование (аналог netcat/socat для ws://). Одиночный статический
  # бинарник websocat.x86_64-unknown-linux-musl (без версии в имени файла).
  - name: websocat
    source: github
    repo: vi/websocat
    url: "https://github.com/vi/websocat/releases/download/{tag}/websocat.x86_64-unknown-linux-musl"
    archive: none
  # tcping — `ping` поверх TCP-порта: проверяет доступность хоста:порта по
  # установлению соединения (когда ICMP закрыт). Статический тарболл
  # tcping-linux-amd64-static.tar.gz, бинарник tcping в корне.
  - name: tcping
    source: github
    repo: pouriyajamshidi/tcping
    url: "https://github.com/pouriyajamshidi/tcping/releases/download/{tag}/tcping-linux-amd64-static.tar.gz"
    archive: tar
    member: tcping
  # doggo — DNS-клиент с человекочитаемым цветным выводом (живой аналог
  # мёртвого dog): DoH/DoT/DoQ, JSON-вывод. Релиз — doggo-linux-x86_64.tar.gz,
  # бинарник doggo в корне.
  - name: doggo
    source: github
    repo: mr-karan/doggo
    url: "https://github.com/mr-karan/doggo/releases/download/{tag}/doggo-linux-x86_64.tar.gz"
    archive: tar
    member: doggo
  # gotty — делится терминалом как веб-приложением (команда в браузере).
  # Дополняет sshx (совместный терминал): пара интерактивных консольных утилит
  # getty на 127.0.0.1. Релиз — тарболл gotty_linux_amd64.tar.gz, бинарник
  # gotty в корне архива.
  - name: gotty
    source: github
    repo: yudai/gotty
    url: "https://github.com/yudai/gotty/releases/download/{tag}/gotty_linux_amd64.tar.gz"
    archive: tar
    member: gotty
  # txeh — управление /etc/hosts из командной строки (добавить/удалить запись,
  # проверить и почистить дубли, показать только нужное) — удобно для локальной
  # разработки вместо ручного редактирования через sudo. В тарболле
  # txeh_Linux_x86_64.tar.gz бинарник txeh в корне.
  - name: txeh
    source: github
    repo: txn2/txeh
    url: "https://github.com/txn2/txeh/releases/download/{tag}/txeh_Linux_x86_64.tar.gz"
    archive: tar
    member: txeh
  # assh — «умный» SSH-клиент: генерирует ~/.ssh/config из YAML-описания
  # (хосты, jump-хосты, прокси, туннели), подставляет ключи и управляет
  # прокси-командами. Релиз — assh_{version}_linux_amd64.tar.gz, бинарник assh.
  - name: assh
    source: github
    repo: moul/assh
    url: "https://github.com/moul/assh/releases/download/{tag}/assh_{version}_linux_amd64.tar.gz"
    archive: tar
    member: assh
  # gossl — простой чекер SSL-сертификатов: цепочка, срок действия,
  # поддерживаемые протоколы и SNI без ручного `openssl s_client`. Релиз —
  # gossl_{version}_linux_amd64.tar.gz, бинарник gossl в корне.
  - name: gossl
    source: github
    repo: vvrnv/gossl
    url: "https://github.com/vvrnv/gossl/releases/download/{tag}/gossl_{version}_linux_amd64.tar.gz"
    archive: tar
    member: gossl
  # crip (certificate-ripper) — вытаскивает цепочку сертификатов с удалённого
  # хоста и умеет сразу положить её в PEM/trust store. Апстрим публикует
  # нативную сборку (GraalVM, JVM не нужна) в crip-linux-amd64.tar.gz;
  # бинарник называется crip — под этим именем и кладём (это команда).
  - name: crip
    source: github
    repo: Hakky54/certificate-ripper
    url: "https://github.com/Hakky54/certificate-ripper/releases/download/{tag}/crip-linux-amd64.tar.gz"
    archive: tar
    member: crip
  # k6 — нагрузочное тестирование сценариями на JS: сценарии, пороги (thresholds),
  # вывод в Prometheus/JSON. Для проверки, как сервис держит нагрузку, до
  # выката. Бинарник в каталоге k6-v{version}-linux-amd64 тарболла.
  - name: k6
    source: github
    repo: grafana/k6
    url: "https://github.com/grafana/k6/releases/download/{tag}/k6-v{version}-linux-amd64.tar.gz"
    archive: tar
    member: k6-v{version}-linux-amd64/k6
  # gping — ping с графиком задержек в терминале: видно джиттер и потери во
  # времени, а не только среднее. Дополняет tcping (тот про TCP-порты) и
  # trippy (трассировка). Тег релиза с префиксом gping- (gping-v1.21.0),
  # поэтому срезаем его version_strip; бинарник gping в корне тарболла.
  - name: gping
    source: github
    repo: orf/gping
    version_strip: "^gping-v"
    url: "https://github.com/orf/gping/releases/download/{tag}/gping-Linux-musl-x86_64.tar.gz"
    archive: tar
    member: gping
  # rustnet — TUI-монитор сети по процессам с разбором пакетов: соединения
  # TCP/UDP/QUIC, протоколы (HTTP, TLS/SNI, DNS, SSH), трафик и здоровье
  # соединений. Дополняет bandwhich (тот только про полосу по процессам) и
  # pktstat-bpf. Берём статическую musl-сборку: бинарник лежит в каталоге
  # rustnet-v{version}-x86_64-unknown-linux-musl, зависимостей от системы нет.
  # Для захвата пакетов нужен setcap (см. tasks/main.yml).
  - name: rustnet
    source: github
    repo: domcyrus/rustnet
    url: "https://github.com/domcyrus/rustnet/releases/download/{tag}/rustnet-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: rustnet-v{version}-x86_64-unknown-linux-musl/rustnet
  # uncover — поиск хостов через API поисковых систем (Shodan, Censys, FOFA,
  # Hunter, Quake, ZoomEye, Netlas, CriminalIP и др.): один запрос по
  # нескольким движкам сразу, вывод `ip:port`, `host`, JSONL или шаблон под
  # пайп в httpx/naabu/nuclei. Ключи нужны только для запросов, не для
  # установки; shodan-idb работает по IP/CIDR вообще без ключа.
  # Релиз — uncover_{version}_linux_amd64.zip, бинарник uncover.
  - name: uncover
    source: github
    repo: projectdiscovery/uncover
    url: "https://github.com/projectdiscovery/uncover/releases/download/{tag}/uncover_{version}_linux_amd64.zip"
    archive: zip
    member: uncover
  # ptcpdump — tcpdump на eBPF: к каждому пакету показывает процесс,
  # контейнер и cgroup, поэтому не нужно искать PID по порту. Дополняет
  # tcpdump и tshark. Релиз — ptcpdump_{version}_linux_amd64.tar.gz, бинарник
  # ptcpdump в корне.
  - name: ptcpdump
    source: github
    repo: mozillazg/ptcpdump
    url: "https://github.com/mozillazg/ptcpdump/releases/download/{tag}/ptcpdump_{version}_linux_amd64.tar.gz"
    archive: tar
    member: ptcpdump
  # lazyssh — SSH-менеджер в стиле lazydocker/k9s: разбирает ~/.ssh/config,
  # подключает к хостам, правит записи и работает с ключами. Дополняет assh
  # (тот генерирует конфиг из YAML). Релиз — lazyssh_Linux_x86_64.tar.gz,
  # бинарник lazyssh в корне.
  - name: lazyssh
    source: github
    repo: Adembc/lazyssh
    url: "https://github.com/Adembc/lazyssh/releases/download/{tag}/lazyssh_Linux_x86_64.tar.gz"
    archive: tar
    member: lazyssh

# --- Sniffnet: графический TUI-анализатор сетевого трафика -----------------
# Ставится официальным .deb из GitHub-релиза (артефакт без версии в имени).
# Тег последнего релиза берётся из редиректа releases/latest.
sniffnet_install: true
sniffnet_repo: GyulyVGC/sniffnet
sniffnet_deb_name: Sniffnet_LinuxDEB_amd64.deb
sniffnet_deb_dir: "{{ tmp_dir }}/sniffnet"

# sshx — совместный терминал в браузере (мгновенный шаринг сессии). Релизных
# ассетов на GitHub нет: официальный install-скрипт качает sshx-<arch>-musl.tar.gz
# с S3 (адрес без версии — всегда актуальный). Поэтому ставится отдельной
# задачей sshx.yml, а не через роль binaries.
sshx_url: "https://s3.amazonaws.com/sshx/sshx-x86_64-unknown-linux-musl.tar.gz"

# bandwhich для чтения сетевого трафика требует CAP_NET_RAW — вешаем setcap
# на бинарник, чтобы он работал без sudo. False = не навешивать (запуск через sudo).
network_bandwhich_setcap: true

# rustnet читает пакеты через libpcap, а владельца соединения ищет через eBPF:
# нужны CAP_NET_RAW, CAP_BPF и CAP_PERFMON. setcap позволяет запускать TUI
# без sudo (иначе — `sudo rustnet`). False = не навешивать.
network_rustnet_setcap: true
