---
# ============================================================================
# Роль network: сетевые утилиты из репозитория Ubuntu + rkn-block-checker.
# ============================================================================

- name: Установить сетевые утилиты
  become: true
  ansible.builtin.apt:
    name: "{{ network_packages }}"
    state: present

- name: Установить бинарники сетевой диагностики (актуальные версии)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ network_binaries }}"

# pipx кладёт приложение в изолированное окружение, а шим — в PIPX_BIN_DIR
# (~/.local/bin, он уже в PATH через devops-shell.sh). sudo не нужен.
# Идемпотентность простая: есть шим — не трогаем (апдейт = pipx upgrade).
- name: Проверить, установлены ли Python-приложения pipx
  ansible.builtin.stat:
    path: "{{ pipx_bin_dir }}/{{ item.creates }}"
  loop: "{{ network_pipx_apps }}"
  loop_control:
    label: "{{ item.name }}"
  register: network_pipx_stat

- name: Установить Python-приложения через pipx
  ansible.builtin.command:
    cmd: "{{ pipx_executable }} install {{ item.item.name }}"
  environment:
    PIPX_HOME: "{{ pipx_home }}"
    PIPX_BIN_DIR: "{{ pipx_bin_dir }}"
    PIPX_DEFAULT_PYTHON: "{{ pipx_python }}"
  loop: "{{ network_pipx_stat.results | rejectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true
