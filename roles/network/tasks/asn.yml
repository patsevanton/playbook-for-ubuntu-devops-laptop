---
# ============================================================================
# asn — справка по IP/домену: ASN, RPKI-валидность, BGP-маршрут, WHOIS,
# владелец, трейс с AS-path и подсказки по диагностике.
# Релизов и готовых архивов у проекта нет: asn — один bash-скрипт в корне
# репозитория, поэтому качаем его из ветки master (по образцу kubectx в роли
# kubernetes) и делаем исполняемым.
#
# Идемпотентность: файл уже есть — в сеть не ходим.
# ============================================================================

- name: Проверить наличие asn
  ansible.builtin.stat:
    path: "{{ bin_dir }}/asn"
  register: asn_stat

- name: Установить asn (bash-скрипт)
  become: true
  ansible.builtin.get_url:
    url: "{{ network_asn_url }}"
    dest: "{{ bin_dir }}/asn"
    mode: "0755"
  when: not asn_stat.stat.exists
