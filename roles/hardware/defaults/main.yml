---
# ============================================================================
# Роль hardware: диагностика железа ноутбука и LACT — настройка и мониторинг
# GPU (AMD/Intel/NVIDIA).
#
# LACT показывает температуру, частоты, вентиляторы и лимиты мощности, умеет
# менять их и профили. Ставится официальным .deb из GitHub-релиза: в пакете
# GUI `lact` и демон `lactd` (systemd-юнит). Версии не фиксируются — тег
# последнего релиза берётся из HTTP-редиректа releases/latest (без GitHub API).
#
# Ассет собран под конкретный релиз Ubuntu: lact-<version>-0.amd64.ubuntu-2604.deb.
# При обновлении дистрибутива (или если апстрим переименует сборку) поменять
# hardware_deb_distro.
#
# Идемпотентность: если /usr/bin/lact уже есть — пакет не переустанавливаем.
# Обновить = удалить пакет и запустить плейбук снова.
# ============================================================================

# --- Диагностика железа (пакеты из репозитория Ubuntu) -----------------------
# Показывают состояние диска и датчиков, а не «что происходит сейчас»: SMART
# и телеметрия NVMe предупреждают о смерти накопителя заранее, sensors —
# о перегреве и залипшем вентиляторе.
hardware_packages:
  # smartmontools — smartctl показывает атрибуты SMART (Reallocated_Sector_Ct,
  # Pending_Sector, Total_LBAs_Written), self-test и лог ошибок, smartd — фоновая
  # проверка с записью в syslog. Демон smartd не включаем: политика оповещения
  # в этом плейбуке не описана (нет MTA), сообщения всё равно попадут в
  # journald — смотреть `journalctl -u smartd`.
  - smartmontools
  # nvme-cli — nvme smart-log, id-ctrl, error-log: детальная телеметрия NVMe
  # (процент износа, температура, число записанных байт, ошибки медиа).
  # Дополняет smartctl, который на NVMe отдаёт урезанный набор атрибутов.
  - nvme-cli
  # lm-sensors — sensors показывает температуры CPU/чипсета, напряжения и
  # обороты вентиляторов. Модули ядра под конкретную плату подбирает
  # `sudo sensors-detect` (интерактивно, один раз после установки).
  - lm-sensors

hardware_repo: ilya-zlobintsev/LACT

# Суффикс ассета релиза: сборки есть для debian-13, ubuntu-2204/2404/2604.
hardware_deb_distro: ubuntu-2604

hardware_deb_dir: "{{ tmp_dir }}/lact"
