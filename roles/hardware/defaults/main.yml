---
# ============================================================================
# Роль hardware: LACT — настройка и мониторинг GPU (AMD/Intel/NVIDIA).
#
# LACT показывает температуру, частоты, вентиляторы и лимиты мощности, умеет
# менять их и профили. Ставится официальным .deb из GitHub-релиза: в пакете
# GUI `lact` и демон `lactd` (systemd-юнит). Версии не фиксируются — тег
# последнего релиза берётся из HTTP-редиректа releases/latest (без GitHub API).
#
# Ассет собран под конкретный релиз Ubuntu: lact-<version>-0.amd64.ubuntu-2604.deb.
# При обновлении дистрибутива (или если апстрим переименует сборку) поменять
# hardware_deb_distro.
#
# Идемпотентность: если /usr/bin/lact уже есть — пакет не переустанавливаем.
# Обновить = удалить пакет и запустить плейбук снова.
# ============================================================================

hardware_repo: ilya-zlobintsev/LACT

# Суффикс ассета релиза: сборки есть для debian-13, ubuntu-2204/2404/2604.
hardware_deb_distro: ubuntu-2604

hardware_deb_dir: "{{ tmp_dir }}/lact"
