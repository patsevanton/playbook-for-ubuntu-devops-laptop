---
# ============================================================================
# Роль postgres: pgCenter — админка и мониторинг PostgreSQL.
# ============================================================================

- name: Установить клиентскую библиотеку PostgreSQL (libpq)
  become: true
  ansible.builtin.apt:
    name: "{{ postgres_packages }}"
    state: present

- name: Установить pgCenter (актуальная версия)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ postgres_binaries }}"

- name: Установить pgcli (psql с автодополнением и подсветкой, pipx)
  ansible.builtin.include_role:
    name: pipx_apps
  vars:
    pipx_apps: "{{ postgres_pipx_apps }}"
