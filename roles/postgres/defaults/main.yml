---
# ============================================================================
# Роль postgres: клиентские инструменты PostgreSQL.
# ============================================================================

# libpq5 — клиентская библиотека PostgreSQL (libpq.so): нужна psycopg, на
# котором работает pgcli. Без неё pipx-окружение ставится, но pgcli падает при
# старте с «no pq wrapper available».
# postgresql-client — штатный CLI: psql, pg_dump, pg_restore, pg_isready.
# pgcli и pgCenter его не заменяют: pg_dump нужен для выгрузки дампа (в том
# числе перед pg_datanymizer), pg_restore — для загрузки.
postgres_packages:
  - libpq5
  - postgresql-client

postgres_binaries:
  # pgcenter — консольная админка и мониторинг PostgreSQL: активность, запросы,
  # блокировки, места и статистика таблиц/индексов, журнал ошибок — прямо с
  # ноутбука по подключению к СУБД (аналог top/htop для Postgres).
  - name: pgcenter
    source: github
    repo: lesovsky/pgcenter
    url: "https://github.com/lesovsky/pgcenter/releases/download/{tag}/pgcenter_{version}_linux_amd64.tar.gz"
    archive: tar
    member: pgcenter
  # rainfrog — TUI-клиент к PostgreSQL, MySQL и SQLite: таблицы, SQL-редактор,
  # история запросов и экспорт результата. Дополняет pgcli (тот только про
  # PostgreSQL). Релиз — rainfrog-v{version}-x86_64-unknown-linux-gnu.tar.gz,
  # бинарник rainfrog в корне.
  - name: rainfrog
    source: github
    repo: achristmascarl/rainfrog
    url: "https://github.com/achristmascarl/rainfrog/releases/download/{tag}/rainfrog-v{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: rainfrog
  # pg_datanymizer (datanymizer) — дамп PostgreSQL с анонимизацией данных по
  # правилам: Faker, замена значений, фильтры по таблицам и колонкам. Нужен,
  # чтобы отдать дамп в тест или разработку без PII. Подключается к живой БД
  # и пишет SQL-дамп; ставится одной командой `pg_datanymizer`. Релиз —
  # pg_datanymizer-linux-x86_64.tar.gz, бинарник в корне архива.
  - name: pg_datanymizer
    source: github
    repo: datanymizer/datanymizer
    url: "https://github.com/datanymizer/datanymizer/releases/download/{tag}/pg_datanymizer-linux-x86_64.tar.gz"
    archive: tar
    member: pg_datanymizer

# --- dbx: GUI-клиент к 100+ СУБД (.deb из GitHub-релиза) ---------------------
# dbx — desktop-клиент к PostgreSQL, MySQL, SQLite, Redis, MongoDB, DuckDB и
# другим базам: дерево схем, SQL-редактор, таблицы, CLI и MCP-сервер. Ставится
# официальным .deb из GitHub-релиза. Имя артефакта — DBX_{version}_amd64.deb
# (версия без ведущего v), тег берётся из редиректа releases/latest.
dbx_install: true
dbx_repo: t8y2/dbx
dbx_deb_dir: "{{ tmp_dir }}/dbx"

# Python-приложения для работы с PostgreSQL (нет релизных бинарников — pipx).
postgres_pipx_apps:
  # pgcli — psql с автодополнением (таблицы, колонки, ключевые слова) и
  # подсветкой синтаксиса; помнит историю и умеет многострочный ввод.
  # Дополняет pgCenter (мониторинг) и psql (штатный клиент).
  - name: pgcli
    creates: pgcli
