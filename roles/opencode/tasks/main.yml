---
# ============================================================================
# Роль opencode: установка актуальной версии из npm-реестра.
#
# Идемпотентность: если {{ bin_dir }}/opencode уже есть — ничего не
# делаем (даже не обращаемся к реестру). Удалить файл = переустановить.
# ============================================================================

- name: Проверить наличие opencode
  ansible.builtin.stat:
    path: "{{ bin_dir }}/opencode"
  register: opencode_stat

- name: Установить opencode
  when: not opencode_stat.stat.exists
  block:
    - name: Проверить поддержку AVX2 (выбор сборки opencode)
      ansible.builtin.command: grep -qw avx2 /proc/cpuinfo
      register: opencode_avx2
      failed_when: false
      changed_when: false

    - name: Выбрать сборку opencode
      ansible.builtin.set_fact:
        opencode_target: "{{ 'linux-x64' if opencode_avx2.rc == 0 else 'linux-x64-baseline' }}"

    - name: Узнать актуальную версию opencode в npm-реестре
      ansible.builtin.uri:
        url: "{{ opencode_meta_url }}"
        return_content: true
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: opencode_meta
      changed_when: false

    - name: Зафиксировать актуальную версию opencode
      ansible.builtin.set_fact:
        opencode_version: "{{ opencode_meta.json.version }}"

    - name: Создать чистый каталог для распаковки opencode
      become: true
      ansible.builtin.file:
        path: "{{ tmp_dir }}/opencode"
        state: absent

    - name: Создать каталог для распаковки opencode
      become: true
      ansible.builtin.file:
        path: "{{ tmp_dir }}/opencode"
        state: directory
        mode: "0755"

    - name: Скачать opencode из npm-реестра
      become: true
      ansible.builtin.get_url:
        url: "{{ opencode_url }}"
        dest: "{{ tmp_dir }}/opencode/opencode.tgz"
        mode: "0644"
        force: true

    - name: Распаковать opencode
      become: true
      ansible.builtin.unarchive:
        src: "{{ tmp_dir }}/opencode/opencode.tgz"
        dest: "{{ tmp_dir }}/opencode/"
        remote_src: true

    - name: Установить opencode в {{ bin_dir }}
      become: true
      ansible.builtin.copy:
        src: "{{ tmp_dir }}/opencode/package/bin/opencode"
        dest: "{{ bin_dir }}/opencode"
        remote_src: true
        mode: "0755"
        owner: root
        group: root

# --- pitwall: GUI-терминал для coding-агентов -------------------------------
- name: Проверить наличие pitwall
  ansible.builtin.stat:
    path: "{{ bin_dir }}/pitwall"
  register: pitwall_stat

- name: Установить pitwall
  when: not pitwall_stat.stat.exists
  block:
    - name: Установить бинарник pitwall (актуальная версия)
      ansible.builtin.include_role:
        name: binaries
      vars:
        binaries_to_install: "{{ pitwall_binaries }}"

    - name: Положить ярлык pitwall в меню приложений
      become: true
      ansible.builtin.copy:
        src: "{{ pitwall_unpack_dir }}/pitwall.desktop"
        dest: "{{ pitwall_desktop_dir }}/pitwall.desktop"
        remote_src: true
        mode: "0644"

    - name: Убедиться, что каталог иконок существует
      become: true
      ansible.builtin.file:
        path: "{{ pitwall_icon_dir }}"
        state: directory
        mode: "0755"

    - name: Положить иконку pitwall
      become: true
      ansible.builtin.copy:
        src: "{{ pitwall_unpack_dir }}/pitwall.svg"
        dest: "{{ pitwall_icon_dir }}/pitwall.svg"
        remote_src: true
        mode: "0644"

    - name: Обновить кэш иконок
      become: true
      ansible.builtin.command: gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor
      changed_when: false
      failed_when: false
