---
# ============================================================================
# Роль opencode: AI-агент в терминале.
#
# В apt его нет, официальный `curl https://opencode.ai/v2/install | bash`
# не подходит: он кладёт бинарь в ~/.opencode/bin и сам правит ~/.bashrc.
# Поэтому плейбук берёт TGZ-пакет из npm-реестра и кладёт бинарник
# в {{ bin_dir }}/opencode. Версия — актуальная в реестре.
#
# Для CPU без AVX2 берётся сборка -baseline.
# ============================================================================
opencode_registry: https://registry.npmjs.org
opencode_package: "{{ opencode_registry }}/@opencode/cli-{{ opencode_target }}"
opencode_meta_url: "{{ opencode_package }}/latest"
opencode_url: "{{ opencode_package }}/-/cli-{{ opencode_target }}-{{ opencode_version }}.tgz"
