---
# ============================================================================
# Роль git: gh (GitHub CLI), glab (GitLab CLI), gitlabcloner.
# ============================================================================

- name: Установить клиенты GitHub и GitLab (актуальные версии)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ git_binaries }}"

- name: Установить Python-приложения для GitLab (gitlabform)
  ansible.builtin.include_role:
    name: pipx_apps
  vars:
    pipx_apps: "{{ git_pipx_apps }}"
