---
# ============================================================================
# Radar — Kubernetes UI со встроенным MCP-сервером для AI-агентов.
# Ставится официальным .deb из GitHub-релиза (radar-desktop_v<ver>_linux_amd64.deb):
# появляется в меню приложений Ubuntu. Зависимости (libgtk-3-0,
# libwebkit2gtk-4.1-0) apt доставит сам.
# Версия не фиксируется: тег последнего релиза берётся из HTTP-редиректа
# releases/latest (без GitHub API — по образцу github_deb.yml).
#
# Идемпотентность: если пакет уже установлен (есть /usr/bin/radar-desktop) —
# ничего не делаем.
# ============================================================================

- name: Проверить, установлен ли radar
  ansible.builtin.stat:
    path: /usr/bin/radar-desktop
  register: radar_installed

- name: Установить radar
  when: not radar_installed.stat.exists
  block:
    - name: Узнать тег последнего релиза radar (через редирект releases/latest)
      ansible.builtin.uri:
        url: "https://github.com/{{ radar_repo }}/releases/latest"
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: radar_release
      changed_when: false

    - name: Определить версию radar
      ansible.builtin.set_fact:
        radar_tag: "{{ radar_release.location | regex_replace('^.*/releases/tag/', '') }}"
        radar_version: >-
          {{ radar_release.location | regex_replace('^.*/releases/tag/', '')
             | regex_replace('^v', '') }}

    - name: Создать каталог для .deb radar
      become: true
      ansible.builtin.file:
        path: "{{ radar_deb_dir }}"
        state: directory
        mode: "0755"

    # Имя артефакта: radar-desktop_v1.17.0_linux_amd64.deb.
    - name: Скачать .deb-пакет radar
      become: true
      ansible.builtin.get_url:
        url: >-
          https://github.com/{{ radar_repo }}/releases/download/{{ radar_tag }}/radar-desktop_v{{ radar_version }}_linux_amd64.deb
        dest: "{{ radar_deb_dir }}/radar-desktop_v{{ radar_version }}_linux_amd64.deb"
        mode: "0644"
        force: true

    - name: Установить radar из .deb
      become: true
      ansible.builtin.apt:
        deb: "{{ radar_deb_dir }}/radar-desktop_v{{ radar_version }}_linux_amd64.deb"
      register: radar_install
      retries: 3
      delay: 5
      until: radar_install is succeeded

    - name: Удалить временный .deb radar
      become: true
      ansible.builtin.file:
        path: "{{ radar_deb_dir }}"
        state: absent
