---
# ============================================================================
# helm-diff — плагин `helm diff upgrade`: показывает, что изменится в кластере
# до применения чарта (и что было изменено в rollback).
#
# Роль binaries не подходит: ставится не бинарник в bin_dir, а helm-плагин.
# Версия берётся из редиректа releases/latest (без GitHub API), как в роли
# binaries. Идемпотентность: есть каталог плагина — ничего не делаем.
# Обновить = удалить каталог плагина и запустить плейбук снова.
# ============================================================================

- name: Проверить, установлен ли плагин helm-diff
  ansible.builtin.stat:
    path: "{{ helm_diff_plugin_dir }}"
  register: helm_diff_stat

- name: Узнать актуальную версию helm-diff
  ansible.builtin.uri:
    url: "https://github.com/{{ helm_diff_repo }}/releases/latest"
    follow_redirects: all
    status_code: [200]
    headers:
      User-Agent: "{{ http_user_agent }}"
  register: helm_diff_release
  changed_when: false
  when: not helm_diff_stat.stat.exists

- name: Узнать версию helm (у helm 4 другой режим проверки плагинов)
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/helm version --short"
  register: helm_diff_helm_version
  changed_when: false
  when: not helm_diff_stat.stat.exists

- name: Установить плагин helm-diff
  ansible.builtin.command:
    cmd: >-
      {{ bin_dir }}/helm plugin install
      https://github.com/{{ helm_diff_repo }}
      --version {{ helm_diff_release.url | regex_replace('^.*/releases/tag/', '') }}
      {{ '--verify=false' if helm_diff_helm_version.stdout is version('v4.0.0', '>=') else '' }}
  when: not helm_diff_stat.stat.exists
  changed_when: true
# --verify=false нужен только helm 4: он требует явно отключить проверку подписи
# для плагинов, которые ставятся напрямую из git (у helm-diff нет provenance).
# Helm 3 такого флага не знает, поэтому он подставляется по major-версии.
