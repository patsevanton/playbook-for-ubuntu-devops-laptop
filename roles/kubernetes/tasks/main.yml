---
# ============================================================================
# Роль kubernetes: kubectl, helm, k9s, kustomize, kubectx, kubecolor,
# kube-capacity, ktop, kubefetch.
# ============================================================================

- name: Установить бинарники Kubernetes (актуальные версии)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ kubernetes_binaries }}"

- name: Проверить наличие kubectx
  ansible.builtin.stat:
    path: "{{ bin_dir }}/kubectx"
  register: kubectx_stat

# kubectx берётся из raw.githubusercontent.com (без релизных артефактов).
# Если файл уже есть — в сеть не ходим (идемпотентность, как в роли binaries).
- name: Установить kubectx (shell-скрипт)
  become: true
  ansible.builtin.get_url:
    url: "{{ kubectx_url }}"
    dest: "{{ bin_dir }}/kubectx"
    mode: "0755"
  when: not kubectx_stat.stat.exists

- name: Проверить наличие bash-completion для kubectx
  ansible.builtin.stat:
    path: "{{ kubectx_completion_path }}"
  register: kubectx_completion_stat

- name: Установить bash-completion для kubectx
  become: true
  ansible.builtin.get_url:
    url: "{{ kubectx_completion_url }}"
    dest: "{{ kubectx_completion_path }}"
    mode: "0644"
  when: not kubectx_completion_stat.stat.exists

# krew уже установлен ролью binaries (бинарник в bin_dir). Плагины ставим
# через `krew install` — он сам кладёт их в каталог плагинов из KREW_ROOT
# (по умолчанию ~/.krew/bin) с префиксом kubectl-. Идемпотентность: если
# плагин уже есть (krew list показывает его), пропускаем.
- name: Проверить установленные krew-плагины
  ansible.builtin.command: "{{ bin_dir }}/krew list"
  register: krew_list_result
  changed_when: false
  failed_when: false

- name: Установить kubectl-плагины через krew
  ansible.builtin.command: "{{ bin_dir }}/krew install {{ item }}"
  loop: "{{ krew_plugins }}"
  loop_control:
    label: "kubectl-{{ item }}"
  changed_when: true
  when: item not in (krew_list_result.stdout | default('') | split('\n'))
