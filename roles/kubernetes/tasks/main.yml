---
# ============================================================================
# Роль kubernetes: kubectl, helm, k9s, kustomize, kubectx, kubecolor,
# kube-capacity, ktop, kubefetch, headlamp.
# ============================================================================

- name: Установить бинарники Kubernetes (актуальные версии)
  ansible.builtin.include_role:
    name: binaries
  vars:
    binaries_to_install: "{{ kubernetes_binaries }}"

- name: Установить плагин helm-diff (helm diff)
  ansible.builtin.include_tasks:
    file: helm-diff.yml
  when: helm_diff_install

- name: Установить плагин helm-secrets (шифрование values через sops)
  ansible.builtin.include_tasks:
    file: helm-secrets.yml
  when: helm_secrets_install

- name: Установить kube-hunter (поиск уязвимостей кластера, pipx)
  ansible.builtin.include_role:
    name: pipx_apps
  vars:
    pipx_apps: "{{ kubernetes_pipx_apps }}"

- name: Установить cdk8s (манифесты Kubernetes кодом)
  ansible.builtin.include_tasks:
    file: cdk8s.yml
  when: cdk8s_install

- name: Установить kosko (манифесты Kubernetes на TypeScript)
  ansible.builtin.include_tasks:
    file: kosko.yml
  when: kosko_install

- name: Установить kubectl-mcp-server (MCP-сервер Kubernetes для AI-клиентов)
  ansible.builtin.include_tasks:
    file: kubectl-mcp-server.yml
  when: kubectl_mcp_server_install

# Одиночные .deb из GitHub-релизов: headlamp, helmwave, k9s, lfk, sextant.
# Задача сравнивает версию из releases/latest с установленной в dpkg, поэтому
# повторный прогон плейбука обновляет пакеты (список — kubernetes_github_debs).
- name: Установить и обновить одиночные .deb из GitHub-релизов
  ansible.builtin.include_tasks:
    file: github_deb.yml
  loop: "{{ kubernetes_github_debs }}"
  loop_control:
    loop_var: deb_item
    label: "{{ deb_item.pkg }}"
  when: deb_item.install | bool

# k9s раньше ставился бинарником в bin_dir: /usr/local/bin/k9s перекрывает
# /usr/bin/k9s из .deb (bin_dir в PATH раньше), поэтому старый файл убираем.
- name: Удалить k9s, установленный ранее как бинарник (переход на .deb)
  become: true
  ansible.builtin.file:
    path: "{{ bin_dir }}/k9s"
    state: absent
  when: k9s_install

- name: Установить Radar (Kubernetes UI со встроенным MCP-сервером)
  ansible.builtin.include_tasks:
    file: radar.yml
  when: radar_install

- name: Установить Monokle (desktop-редактор Kubernetes-конфигов)
  ansible.builtin.include_tasks:
    file: monokle.yml
  when: monokle_install

- name: Установить Rubick (desktop-клиент Kubernetes)
  ansible.builtin.include_tasks:
    file: rubick.yml
  when: rubick_install

- name: Установить Klustr (desktop-клиент Kubernetes)
  ansible.builtin.include_tasks:
    file: klustr.yml
  when: klustr_install

- name: Установить kubebox (терминальная и веб-консоль Kubernetes)
  ansible.builtin.include_tasks:
    file: kubebox.yml
  when: kubebox_install

- name: Установить kubectl-ports (порты подов и сервисов)
  ansible.builtin.include_tasks:
    file: kubectl-ports.yml
  when: kubectl_ports_install

- name: Проверить наличие kubectx
  ansible.builtin.stat:
    path: "{{ bin_dir }}/kubectx"
  register: kubectx_stat

# kubectx берётся из raw.githubusercontent.com (без релизных артефактов).
# Если файл уже есть — в сеть не ходим (идемпотентность, как в роли binaries).
- name: Установить kubectx (shell-скрипт)
  become: true
  ansible.builtin.get_url:
    url: "{{ kubectx_url }}"
    dest: "{{ bin_dir }}/kubectx"
    mode: "0755"
  when: not kubectx_stat.stat.exists

- name: Проверить наличие bash-completion для kubectx
  ansible.builtin.stat:
    path: "{{ kubectx_completion_path }}"
  register: kubectx_completion_stat

- name: Установить bash-completion для kubectx
  become: true
  ansible.builtin.get_url:
    url: "{{ kubectx_completion_url }}"
    dest: "{{ kubectx_completion_path }}"
    mode: "0644"
  when: not kubectx_completion_stat.stat.exists
