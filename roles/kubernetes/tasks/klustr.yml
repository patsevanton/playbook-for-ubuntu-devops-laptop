---
# ============================================================================
# Klustr — нативный desktop-клиент Kubernetes (Tauri: Rust + React).
# Ставится официальным .deb из GitHub-релиза (klustr_<ver>_amd64.deb):
# появляется в меню приложений Ubuntu. Зависимости (libwebkit2gtk-4.1-0,
# libgtk-3-0) apt доставит сам.
# Версия не фиксируется: тег последнего релиза берётся из HTTP-редиректа
# releases/latest (без GitHub API — по образцу rubick.yml).
#
# Идемпотентность: если приложение уже установлено (есть /usr/bin/klustr) —
# ничего не делаем.
# ============================================================================

- name: Проверить, установлен ли klustr
  ansible.builtin.stat:
    path: /usr/bin/klustr
  register: klustr_installed

- name: Установить klustr
  when: not klustr_installed.stat.exists
  block:
    - name: Узнать тег последнего релиза klustr (через редирект releases/latest)
      ansible.builtin.uri:
        url: "https://github.com/{{ klustr_repo }}/releases/latest"
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: klustr_release
      changed_when: false

    - name: Определить версию klustr
      ansible.builtin.set_fact:
        klustr_tag: "{{ klustr_release.location | regex_replace('^.*/releases/tag/', '') }}"
        klustr_version: >-
          {{ klustr_release.location | regex_replace('^.*/releases/tag/', '')
             | regex_replace('^v', '') }}

    - name: Создать каталог для .deb klustr
      become: true
      ansible.builtin.file:
        path: "{{ klustr_deb_dir }}"
        state: directory
        mode: "0755"

    # Имя артефакта: klustr_0.91.1_amd64.deb.
    - name: Скачать .deb-пакет klustr
      become: true
      ansible.builtin.get_url:
        url: >-
          https://github.com/{{ klustr_repo }}/releases/download/{{ klustr_tag }}/klustr_{{ klustr_version }}_amd64.deb
        dest: "{{ klustr_deb_dir }}/klustr_{{ klustr_version }}_amd64.deb"
        mode: "0644"
        force: true

    - name: Установить klustr из .deb
      become: true
      ansible.builtin.apt:
        deb: "{{ klustr_deb_dir }}/klustr_{{ klustr_version }}_amd64.deb"
      register: klustr_install
      retries: 3
      delay: 5
      until: klustr_install is succeeded

    - name: Удалить временный .deb klustr
      become: true
      ansible.builtin.file:
        path: "{{ klustr_deb_dir }}"
        state: absent
