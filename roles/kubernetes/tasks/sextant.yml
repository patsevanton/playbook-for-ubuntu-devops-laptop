---
# ============================================================================
# Sextant — desktop-клиент Kubernetes (альтернатива Lens) на Rust/Tauri.
# Ставится официальным .deb из GitHub-релиза (Sextant_<ver>_amd64.deb):
# появляется в меню приложений Ubuntu. Зависимости (libwebkit2gtk-4.1-0,
# libgtk-3-0) apt доставит сам.
# Версия не фиксируется: тег последнего релиза берётся из HTTP-редиректа
# releases/latest (без GitHub API — по образцу headlamp.yml).
#
# Идемпотентность: если пакет уже установлен (есть /usr/bin/sextant) —
# ничего не делаем.
# ============================================================================

- name: Проверить, установлен ли sextant
  ansible.builtin.stat:
    path: /usr/bin/sextant
  register: sextant_installed

- name: Установить sextant
  when: not sextant_installed.stat.exists
  block:
    - name: Узнать тег последнего релиза sextant (через редирект releases/latest)
      ansible.builtin.uri:
        url: "https://github.com/{{ sextant_repo }}/releases/latest"
        follow_redirects: none
        status_code: [301, 302, 303, 307, 308]
        headers:
          User-Agent: "{{ http_user_agent }}"
      register: sextant_release
      changed_when: false

    - name: Определить версию sextant
      ansible.builtin.set_fact:
        sextant_tag: "{{ sextant_release.location | regex_replace('^.*/releases/tag/', '') }}"
        sextant_version: >-
          {{ sextant_release.location | regex_replace('^.*/releases/tag/', '')
             | regex_replace('^v', '') }}

    - name: Создать каталог для .deb sextant
      become: true
      ansible.builtin.file:
        path: "{{ sextant_deb_dir }}"
        state: directory
        mode: "0755"

    # Имя артефакта: Sextant_0.22.0_amd64.deb (версия без префикса v).
    - name: Скачать .deb-пакет sextant
      become: true
      ansible.builtin.get_url:
        url: >-
          https://github.com/{{ sextant_repo }}/releases/download/{{ sextant_tag }}/Sextant_{{ sextant_version }}_amd64.deb
        dest: "{{ sextant_deb_dir }}/Sextant_{{ sextant_version }}_amd64.deb"
        mode: "0644"
        force: true

    - name: Установить sextant из .deb
      become: true
      ansible.builtin.apt:
        deb: "{{ sextant_deb_dir }}/Sextant_{{ sextant_version }}_amd64.deb"
      register: sextant_install
      retries: 3
      delay: 5
      until: sextant_install is succeeded

    - name: Удалить временный .deb sextant
      become: true
      ansible.builtin.file:
        path: "{{ sextant_deb_dir }}"
        state: absent
