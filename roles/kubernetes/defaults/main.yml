# --- Radar: Kubernetes UI со встроенным MCP-сервером (.deb из GitHub-релиза) --
# Desktop-приложение (Tauri): обзор кластера, ресурсы, YAML, события, логи и
# встроенный MCP-сервер — тем же интерфейсом может пользоваться AI-агент
# (opencode, Claude и др.). Дополняет headlamp, но с уклоном в MCP.
# Имя артефакта radar-desktop_v{version}_linux_amd64.deb (версия без v).
# Версия берётся из редиректа releases/latest (см. tasks/radar.yml).
radar_install: true
radar_repo: skyhook-io/radar
radar_deb_dir: "{{ tmp_dir }}/radar"

# --- Headlamp: web/desktop UI Kubernetes (.deb из GitHub-релиза) --------------
# GUI-приложение ~123 МБ (Electron): ставится официальным .deb, появляется в
# меню приложений. Имя артефакта headlamp_<ver>-1_amd64.deb (версия без v).
# Версия берётся из редиректа releases/latest (см. tasks/headlamp.yml).
headlamp_install: true
headlamp_repo: kubernetes-sigs/headlamp
headlamp_deb_dir: "{{ tmp_dir }}/headlamp"

# --- Monokle: desktop-редактор Kubernetes-конфигов (.deb из GitHub-релиза) ---
# Electron-приложение: авторство и анализ манифестов, валидация по схемам,
# сравнение с кластером. Имя артефакта Monokle-linux-{version}-amd64.deb
# (версия без префикса v). Версия берётся из редиректа releases/latest
# (см. tasks/monokle.yml).
monokle_install: true
monokle_repo: kubeshop/monokle
monokle_deb_dir: "{{ tmp_dir }}/monokle"

# --- Rubick: лёгкий desktop-клиент Kubernetes (.deb из GitHub-релиза) --------
# Tauri-приложение: ресурсы, логи, YAML, port-forward, RBAC-aware. Имя
# артефакта Rubick_{version}_amd64.deb (версия без префикса v). Версия
# берётся из редиректа releases/latest (см. tasks/rubick.yml).
rubick_install: true
rubick_repo: Dudude-bit/rubick
rubick_deb_dir: "{{ tmp_dir }}/rubick"

# --- Klustr: desktop-клиент Kubernetes (.deb из GitHub-релиза) ---------------
# Tauri-приложение: работает по kubeconfig, ничего не ставит в кластер.
# Имя артефакта klustr_<ver>_amd64.deb (версия без v). Версия берётся из
# редиректа releases/latest (см. tasks/klustr.yml).
klustr_install: true
klustr_repo: SametKUM/klustr
klustr_deb_dir: "{{ tmp_dir }}/klustr"

# --- Sextant: desktop-клиент Kubernetes, альтернатива Lens (.deb) ------------
# Rust/Tauri-приложение: все контексты из kubeconfig сразу, ресурсы и YAML
# со схемой кластера, логи, шеллы в контейнерах и на нодах, port-forward,
# Helm/Flux/Argo CD, Istio/Linkerd, RBAC, right-sizing, диагностика сети и
# встроенный MCP-сервер для AI-агентов. Без аккаунта и телеметрии.
# Имя артефакта Sextant_{version}_amd64.deb (версия без v, с заглавной S).
# Версия берётся из редиректа releases/latest (см. tasks/sextant.yml).
sextant_install: true
sextant_repo: FriendsOfKubernetes/sextant
sextant_deb_dir: "{{ tmp_dir }}/sextant"

# kubectx — shell-скрипт без релизных артефактов, берётся из ветки master.
kubectx_ref: master
kubectx_url: "https://raw.githubusercontent.com/ahmetb/kubectx/{{ kubectx_ref }}/kubectx"
kubectx_completion_url: "https://raw.githubusercontent.com/ahmetb/kubectx/{{ kubectx_ref }}/completion/kubectx.bash"
kubectx_completion_path: /etc/bash_completion.d/kubectx

# --- helm-diff: плагин `helm diff` (что изменится до применения) -------------
# Ставится не ролью binaries: это helm-плагин, а не бинарник в bin_dir.
# Версия берётся из редиректа releases/latest (без GitHub API), установка —
# `helm plugin install ... --version`. Каталог плагинов по умолчанию —
# ~/.local/share/helm/plugins; есть каталог плагина — уже установлен.
helm_diff_install: true
helm_diff_repo: databus23/helm-diff
helm_diff_plugins_dir: "{{ home_dir }}/.local/share/helm/plugins"
helm_diff_plugin_dir: "{{ helm_diff_plugins_dir }}/helm-diff"

# --- helm-secrets: шифрование values через sops (плагин helm) ----------------
# `helm secrets enc/dec/view/edit` и прозрачная расшифровка values при
# `helm secrets upgrade`. Ключи — sops (age уже стоит в роли secrets), git —
# для хранения зашифрованных файлов рядом с чартом. Ставится не ролью
# binaries: это helm-плагин. Версия берётся из редиректа releases/latest.
helm_secrets_install: true
helm_secrets_repo: jkroepke/helm-secrets
helm_secrets_plugins_dir: "{{ home_dir }}/.local/share/helm/plugins"
helm_secrets_plugin_dir: "{{ helm_secrets_plugins_dir }}/helm-secrets"

# --- kube-hunter: поиск уязвимостей кластера (pipx) --------------------------
# Linux-бинарников в релизах нет — ставится из PyPI в изолированное окружение.
# Команда — kube-hunter.
kubernetes_pipx_apps:
  - name: kube-hunter
    creates: kube-hunter
  # knetvis — визуализация и тестирование NetworkPolicy. Релизных ассетов
  # нет, ставится из PyPI.
  - name: knetvis
    creates: knetvis
  # kptop — TUI-мониторинг нод, подов и PVC через Prometheus. Standalone-
  # бинарников в релизах нет, ставится из PyPI. На запуске нужен
  # KPTOP_CONNECTION_METHOD (см. README проекта).
  - name: kptop
    creates: kptop

# --- cdk8s: Kubernetes-манифесты кодом (npm) --------------------------------
# CLI ставится глобально из npm-пакета cdk8s-cli, команда — cdk8s.
cdk8s_install: true
cdk8s_package: cdk8s-cli
cdk8s_bin: "{{ bin_dir }}/cdk8s"

# --- kosko: Kubernetes-манифесты на TypeScript (npm) -------------------------
# Компоненты манифестов пишутся на TypeScript/JavaScript, `kosko generate`
# рендерит их в YAML, `kosko validate` проверяет по схемам. Релизных
# бинарников апстрим не публикует, CLI есть только в npm-пакете kosko —
# ставится так же, как cdk8s.
kosko_install: true
kosko_package: kosko
kosko_bin: "{{ bin_dir }}/kosko"

# --- kubectl-mcp-server: MCP-сервер Kubernetes (pipx) ------------------------
# MCP-сервер для AI-клиентов (opencode, Claude, Cursor и др.). Готовых
# бинарников апстрим не публикует — ставится из PyPI в изолированный venv
# через pipx, шим кладётся в {{ pipx_bin_dir }}. npm-пакет с тем же именем
# является лишь обёрткой над этим Python-модулем, поэтому берём первоисточник.
#
# Read-only — это флаг ЗАПУСКА, а не свойство установки:
# `kubectl-mcp-server --read-only` блокирует все write-операции. Флаг
# прописывается в конфиге MCP-клиента (см. tasks/kubectl-mcp-server.yml);
# без него AI получает полный доступ на запись в кластер. Мягкий вариант —
# `--disable-destructive` (блокирует только удаление).
kubectl_mcp_server_install: true
kubectl_mcp_server_package: kubectl-mcp-server
kubectl_mcp_server_bin: "{{ pipx_bin_dir }}/kubectl-mcp-server"

# --- kubebox: терминальная и веб-консоль Kubernetes --------------------------
# Терминальный dashboard (pod, logs, exec, YAML) с запуском по SSH без
# desktop-приложения и с опцией веб-режима в браузере. Апстрим публикует
# только npm-пакет (бинарников в релизах нет), ставится `npm install -g`.
# Дополняет headlamp (desktop GUI) именно для ssh-сессий.
kubebox_install: true
kubebox_package: kubebox
kubebox_bin: "{{ bin_dir }}/kubebox"

# --- kubectl-ports: порты подов и сервисов (плагин kubectl) ------------------
# `kubectl ports` печатает таблицу портов, объявленных контейнерами подов
# (namespace, под, контейнер, порт/протокол, имя порта), а `kubectl ports svc`
# — опубликованные порты Service'ов (ClusterIP, targetPort, port, NodePort).
# Написан на Rust (kube-rs), релизный бинарник — статический musl, без
# зависимостей от библиотек системы.
#
# Ставится отдельной задачей, а не через kubernetes_binaries: в последнем
# релизе 1.1.1 не собрались ассеты (в релизе нет ни одного файла), рабочий
# бинарник есть только в 1.1.0 — поэтому тег зафиксирован. Как только апстрим
# выпустит релиз с ассетами, запись можно перенести в kubernetes_binaries.
# Апстрим в krew-index плагин не публикует, а cargo/rust в плейбуке нет.
kubectl_ports_install: true
kubectl_ports_version: 1.1.0
kubectl_ports_archive: "kubectl-ports_{{ kubectl_ports_version }}-x86_64-unknown-linux-musl.tar.gz"
kubectl_ports_url: "https://github.com/widnyana/kubectl-ports-rs/releases/download/{{ kubectl_ports_version }}/{{ kubectl_ports_archive }}"
kubectl_ports_unpack_dir: "{{ tmp_dir }}/kubectl-ports"
