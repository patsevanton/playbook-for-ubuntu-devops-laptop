  - name: pumba
    source: github
    repo: alexei-led/pumba
    url: "https://github.com/alexei-led/pumba/releases/download/{tag}/pumba_linux_amd64"
    archive: none
  # kopilot — AI-ассистент Kubernetes: диагностика и объяснение ресурсов.
  # Релиз — kopilot_v{version}_linux_amd64.tar.gz.
  - name: kopilot
    source: github
