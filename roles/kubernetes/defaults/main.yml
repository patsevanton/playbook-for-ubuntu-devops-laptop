    url: "https://github.com/tanrikuluozlem/burn/releases/download/{tag}/burn_{version}_linux_amd64.tar.gz"
    archive: tar
    member: burn
  # tk (Grafana Tanka) — Jsonnet-конфигурация Kubernetes с переиспользованием.
  # Одиночный бинарник tk-linux-amd64.
  - name: tk
    source: github
    repo: grafana/tanka
    url: "https://github.com/grafana/tanka/releases/download/{tag}/tk-linux-amd64"
    archive: none
  # audit2rbac — генерация RBAC-политик из Kubernetes audit-логов.
  # Релиз — audit2rbac-linux-amd64.tar.gz.
  - name: audit2rbac
    source: github
    repo: liggitt/audit2rbac
    url: "https://github.com/liggitt/audit2rbac/releases/download/{tag}/audit2rbac-linux-amd64.tar.gz"
    archive: tar
    member: audit2rbac
  # pumba — chaos-тестирование контейнеров: пауза, kill, остановка, сетевые
