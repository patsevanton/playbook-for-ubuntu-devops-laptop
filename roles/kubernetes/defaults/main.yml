  # kubectl-outagedeck — плагин kubectl: статус облачных провайдеров по
  # аннотациям workload'ов. Имя с префиксом даёт `kubectl outagedeck`.
  - name: kubectl-outagedeck
    source: github
    repo: outagedeck/kubectl-outagedeck
    url: "https://github.com/outagedeck/kubectl-outagedeck/releases/download/{tag}/kubectl-outagedeck_linux_amd64.tar.gz"
    archive: tar
    member: kubectl-outagedeck

# --- Radar: Kubernetes UI со встроенным MCP-сервером (.deb из GitHub-релиза) --
# Desktop-приложение (Tauri): обзор кластера, ресурсы, YAML, события, логи и
# встроенный MCP-сервер — тем же интерфейсом может пользоваться AI-агент
# (opencode, Claude и др.). Дополняет headlamp, но с уклоном в MCP.
# Имя артефакта radar-desktop_v{version}_linux_amd64.deb (версия без v).
# Версия берётся из редиректа releases/latest (см. tasks/radar.yml).
radar_install: true
radar_repo: skyhook-io/radar
radar_deb_dir: "{{ tmp_dir }}/radar"

# --- Headlamp: web/desktop UI Kubernetes (.deb из GitHub-релиза) --------------
# GUI-приложение ~123 МБ (Electron): ставится официальным .deb, появляется в
# меню приложений. Имя артефакта headlamp_<ver>-1_amd64.deb (версия без v).
# Версия берётся из редиректа releases/latest (см. tasks/headlamp.yml).
headlamp_install: true
headlamp_repo: kubernetes-sigs/headlamp
headlamp_deb_dir: "{{ tmp_dir }}/headlamp"

# --- Monokle: desktop-редактор Kubernetes-конфигов (.deb из GitHub-релиза) ---
# Electron-приложение: авторство и анализ манифестов, валидация по схемам,
# сравнение с кластером. Имя артефакта Monokle-linux-{version}-amd64.deb
# (версия без префикса v). Версия берётся из редиректа releases/latest
# (см. tasks/monokle.yml).
monokle_install: true
monokle_repo: kubeshop/monokle
monokle_deb_dir: "{{ tmp_dir }}/monokle"

# --- Rubick: лёгкий desktop-клиент Kubernetes (.deb из GitHub-релиза) --------
# Tauri-приложение: ресурсы, логи, YAML, port-forward, RBAC-aware. Имя
# артефакта Rubick_{version}_amd64.deb (версия без префикса v). Версия
# берётся из редиректа releases/latest (см. tasks/rubick.yml).
rubick_install: true
rubick_repo: Dudude-bit/rubick
rubick_deb_dir: "{{ tmp_dir }}/rubick"

# --- Klustr: desktop-клиент Kubernetes (.deb из GitHub-релиза) ---------------
# Tauri-приложение: работает по kubeconfig, ничего не ставит в кластер.
# Имя артефакта klustr_<ver>_amd64.deb (версия без v). Версия берётся из
# редиректа releases/latest (см. tasks/klustr.yml).
klustr_install: true
klustr_repo: SametKUM/klustr
klustr_deb_dir: "{{ tmp_dir }}/klustr"

# kubectx — shell-скрипт без релизных артефактов, берётся из ветки master.
kubectx_ref: master
kubectx_url: "https://raw.githubusercontent.com/ahmetb/kubectx/{{ kubectx_ref }}/kubectx"
kubectx_completion_url: "https://raw.githubusercontent.com/ahmetb/kubectx/{{ kubectx_ref }}/completion/kubectx.bash"
kubectx_completion_path: /etc/bash_completion.d/kubectx

# --- kube-hunter: поиск уязвимостей кластера (pipx) --------------------------
# Linux-бинарников в релизах нет — ставится из PyPI в изолированное окружение.
# Команда — kube-hunter.
kubernetes_pipx_apps:
  - name: kube-hunter
    creates: kube-hunter
  # knetvis — визуализация и тестирование NetworkPolicy. Релизных ассетов
  # нет, ставится из PyPI.
  - name: knetvis
    creates: knetvis
  # kptop — TUI-мониторинг нод, подов и PVC через Prometheus. Standalone-
  # бинарников в релизах нет, ставится из PyPI. На запуске нужен
  # KPTOP_CONNECTION_METHOD (см. README проекта).
  - name: kptop
    creates: kptop

# --- cdk8s: Kubernetes-манифесты кодом (npm) --------------------------------
# CLI ставится глобально из npm-пакета cdk8s-cli, команда — cdk8s.
cdk8s_install: true
cdk8s_package: cdk8s-cli
cdk8s_bin: "{{ bin_dir }}/cdk8s"

# --- kubebox: терминальная и веб-консоль Kubernetes --------------------------
# Терминальный dashboard (pod, logs, exec, YAML) с запуском по SSH без
# desktop-приложения и с опцией веб-режима в браузере. Апстрим публикует
# только npm-пакет (бинарников в релизах нет), ставится `npm install -g`.
# Дополняет headlamp (desktop GUI) именно для ssh-сессий.
kubebox_install: true
kubebox_package: kubebox
kubebox_bin: "{{ bin_dir }}/kubebox"
