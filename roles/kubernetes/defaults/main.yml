---
# ============================================================================
# Роль kubernetes: клиентские утилиты Kubernetes.
# Версии определяются на момент запуска (source=text / source=github).
# kubectl-плагины ставим только готовыми бинарниками (kubectl-k8i,
# kubectl-tree), без установки через krew. ktop и kubecolor — самостоятельные
# бинарники (kubectl-ktop из релиза не берём).
# ============================================================================
kubernetes_binaries:
  - name: kubectl
    source: text
    version_url: https://dl.k8s.io/release/stable.txt
    url: "https://dl.k8s.io/release/v{version}/bin/linux/amd64/kubectl"
    archive: none
  - name: helm
    source: text
    version_url: https://get.helm.sh/helm-latest-version
    url: "https://get.helm.sh/helm-v{version}-linux-amd64.tar.gz"
    archive: tar
    member: linux-amd64/helm
  - name: k9s
    source: github
    repo: derailed/k9s
    url: "https://github.com/derailed/k9s/releases/download/{tag}/k9s_Linux_amd64.tar.gz"
    archive: tar
    member: k9s
  - name: kustomize
    source: github
    repo: kubernetes-sigs/kustomize
    version_strip: "^kustomize/v"
    url: "https://github.com/kubernetes-sigs/kustomize/releases/download/{tag}/kustomize_v{version}_linux_amd64.tar.gz"
    archive: tar
    member: kustomize
  - name: flux
    source: github
    repo: fluxcd/flux2
    url: "https://github.com/fluxcd/flux2/releases/download/{tag}/flux_{version}_linux_amd64.tar.gz"
    archive: tar
    member: flux
  - name: flux9s
    source: github
    repo: dgunzy/flux9s
    url: "https://github.com/dgunzy/flux9s/releases/download/{tag}/flux9s-linux-x86_64-gnu.tar.gz"
    archive: tar
    member: flux9s
  - name: stern
    source: github
    repo: stern/stern
    url: "https://github.com/stern/stern/releases/download/{tag}/stern_{version}_linux_amd64.tar.gz"
    archive: tar
    member: stern
  # flate/flux-tools — офлайн-рендер и дифф Flux GitOps-репозитория без
  # кластера (Helm + kustomize внутри бинарника). flate — Go-переписывание
  # flux-local, flux-tools — независимая реализация.
  - name: flate
    source: github
    repo: home-operations/flate
    url: "https://github.com/home-operations/flate/releases/download/{tag}/flate_{version}_linux_amd64.tar.gz"
    archive: tar
    member: flate
  - name: flux-tools
    source: github
    repo: alexandervidyaev/flux-tools
    url: "https://github.com/alexandervidyaev/flux-tools/releases/download/{tag}/flux-tools_{version}_linux_amd64.tar.gz"
    archive: tar
    member: flux-tools
  # cty (crd-to-sample-yaml) — генерация sample-YAML из CRD и валидация схем.
  - name: cty
    source: github
    repo: Skarlso/crd-to-sample-yaml
    url: "https://github.com/Skarlso/crd-to-sample-yaml/releases/download/{tag}/cty_linux_amd64.tar.gz"
    archive: tar
    member: cty
  # diffyml — структурный дифф YAML с учётом специфики Kubernetes.
  - name: diffyml
    source: github
    repo: szhekpisov/diffyml
    url: "https://github.com/szhekpisov/diffyml/releases/download/{tag}/diffyml_{version}_linux_amd64.tar.gz"
    archive: tar
    member: diffyml
  # kubectl-k8i — плагин kubectl: ресурсы нод с цветовой индикацией загрузки.
  # Имя файла с префиксом kubectl- делает его доступным как `kubectl k8i`.
  - name: kubectl-k8i
    source: github
    repo: ViktorUJ/kubectl-k8i
    url: "https://github.com/ViktorUJ/kubectl-k8i/releases/download/{tag}/kubectl-k8i_linux_amd64.tar.gz"
    archive: tar
    member: kubectl-k8i
  # kubespy — наблюдение за изменениями ресурсов Kubernetes в реальном времени.
  - name: kubespy
    source: github
    repo: pulumi/kubespy
    url: "https://github.com/pulumi/kubespy/releases/download/{tag}/kubespy-v{version}-linux-amd64.tar.gz"
    archive: tar
    member: kubespy
  # kubecolor — цветной, читаемый вывод kubectl: обёртка над kubectl, красит
  # ресурсы, диффы, логи и ошибки. Вызывается явно (kubecolor get pods),
  # kubectl остаётся самим собой — алиасы в shell не навешиваем.
  - name: kubecolor
    source: github
    repo: kubecolor/kubecolor
    url: "https://github.com/kubecolor/kubecolor/releases/download/{tag}/kubecolor_{version}_linux_amd64.tar.gz"
    archive: tar
    member: kubecolor
  # kube-capacity — обзор ресурсов кластера: requests/limits по нодам и подам
  # против фактического потребления (нужен metrics-server).
  - name: kube-capacity
    source: github
    repo: robscott/kube-capacity
    url: "https://github.com/robscott/kube-capacity/releases/download/{tag}/kube-capacity_{tag}_linux_x86_64.tar.gz"
    archive: tar
    member: kube-capacity
  # ktop — top-подобный TUI-монитор метрик нод и подов (нужен metrics-server).
  # Из релиза берём одиночный ktop, а не kubectl-ktop: плагины kubectl не ставим.
  # В именах артефактов версия с префиксом v (ktop_v0.5.3_...), поэтому в URL
  # подставляем {tag}, а не {version}.
  - name: ktop
    source: github
    repo: vladimirvivien/ktop
    url: "https://github.com/vladimirvivien/ktop/releases/download/{tag}/ktop_{tag}_linux_amd64.tar.gz"
    archive: tar
    member: ktop
  # kubefetch — neofetch для Kubernetes-кластера: сводка кластера/нод/подов
  # в терминале. Релиз — одиночный бинарник без архива.
  - name: kubefetch
    source: github
    repo: jkulzer/kubefetch
    url: "https://github.com/jkulzer/kubefetch/releases/download/{tag}/kubefetch"
    archive: none
  # krew — менеджер kubectl-плагинов (для будущих плагинов); сами
  # view-secret / df-pv / browse-pvc ставим напрямую бинарниками ниже.
  # В архиве бинарник лежит как ./krew-linux_amd64.
  - name: krew
    source: github
    repo: kubernetes-sigs/krew
    url: "https://github.com/kubernetes-sigs/krew/releases/download/{tag}/krew-linux_amd64.tar.gz"
    archive: tar
    member: krew-linux_amd64
  # view-secret — декодирование секретов (в архиве бинарник kubectl-view-secret,
  # на диск кладём под именем view-secret — вызывается напрямую, не как плагин).
  - name: view-secret
    source: github
    repo: elsesiy/kubectl-view-secret
    url: "https://github.com/elsesiy/kubectl-view-secret/releases/download/{tag}/kubectl-view-secret_{tag}_linux_amd64.tar.gz"
    archive: tar
    member: kubectl-view-secret
  # df-pv — df по PersistentVolume. В архиве бинарник df-pv, имя совпадает.
  - name: df-pv
    source: github
    repo: yashbhutwala/kubectl-df-pv
    url: "https://github.com/yashbhutwala/kubectl-df-pv/releases/download/{tag}/kubectl-df-pv_{tag}_linux_amd64.tar.gz"
    archive: tar
    member: df-pv
  # browse-pvc — просмотр PVC из CLI. Релиз — zip без версии в имени файла
  # (kubectl-browse-pvc-linux-x86_64.zip), бинарник внутри kubectl-browse-pvc,
  # на диск кладём под именем browse-pvc.
  - name: browse-pvc
    source: github
    repo: clbx/kubectl-browse-pvc
    url: "https://github.com/clbx/kubectl-browse-pvc/releases/download/{tag}/kubectl-browse-pvc-linux-x86_64.zip"
    archive: zip
    member: kubectl-browse-pvc
  # pluto — находит устаревшие/удалённые apiVersion в манифестах.
  - name: pluto
    source: github
    repo: FairwindsOps/pluto
    url: "https://github.com/FairwindsOps/pluto/releases/download/{tag}/pluto_{version}_linux_amd64.tar.gz"
    archive: tar
    member: pluto
  # pv-migrate — миграция и backup/restore PersistentVolume.
  - name: pv-migrate
    source: github
    repo: utkuozdemir/pv-migrate
    url: "https://github.com/utkuozdemir/pv-migrate/releases/download/{tag}/pv-migrate_{tag}_linux_x86_64.tar.gz"
    archive: tar
    member: pv-migrate
  # marvin — сканер кластера CEL-выражениями: проблемы, мисконфиги, уязвимости.
  - name: marvin
    source: github
    repo: undistro/marvin
    url: "https://github.com/undistro/marvin/releases/download/{tag}/marvin_Linux_x86_64.tar.gz"
    archive: tar
    member: marvin
  # kftui — TUI-менеджер kubectl port-forward и reverse-туннелей (kftray).
  # Из релиза берём TUI-бинарник: в архиве kftui_linux_amd64, кладём как kftui.
  - name: kftui
    source: github
    repo: hcavarsan/kftray
    url: "https://github.com/hcavarsan/kftray/releases/download/{tag}/kftui_linux_amd64.tar.gz"
    archive: tar
    member: kftui_linux_amd64
  # chart-testing (ct) — линтинг и тестирование Helm-чартов (helm/chart-testing).
  # Релиз — chart-testing_{version}_linux_amd64.tar.gz, бинарник ct в корне.
  - name: ct
    source: github
    repo: helm/chart-testing
    url: "https://github.com/helm/chart-testing/releases/download/{tag}/chart-testing_{version}_linux_amd64.tar.gz"
    archive: tar
    member: ct
  # ytt — шаблонизатор YAML: работает со структурой документа (не текстом),
  # умеет условия, циклы и переиспользуемые фрагменты. Релиз — одиночный
  # бинарник ytt-linux-amd64 без архива и без версии в имени файла.
  - name: ytt
    source: github
    repo: carvel-dev/ytt
    url: "https://github.com/carvel-dev/ytt/releases/download/{tag}/ytt-linux-amd64"
    archive: none
  # kbld — встраивает конкретные образы в Kubernetes-манифесты: находит image-
  # ссылки, резолвит их в digest, при необходимости собирает и пушит, а на
  # выходе отдаёт манифест с зафиксированными версиями (тот же набор, что ytt).
  # Одиночный бинарник kbld-linux-amd64 без архива и версии в имени.
  - name: kbld
    source: github
    repo: carvel-dev/kbld
    url: "https://github.com/carvel-dev/kbld/releases/download/{tag}/kbld-linux-amd64"
    archive: none
  # chartsnap (helm-chartsnap) — snapshot-тесты Helm-чартов: рендерит чарт
  # с разными values и сравнивает с сохранёнными снапшотами, показывая
  # структурный diff YAML при изменениях. Релиз —
  # chartsnap_v{version}_linux_amd64.tar.gz, бинарник chartsnap в корне.
  - name: chartsnap
    source: github
    repo: jlandowner/helm-chartsnap
    url: "https://github.com/jlandowner/helm-chartsnap/releases/download/{tag}/chartsnap_v{version}_linux_amd64.tar.gz"
    archive: tar
    member: chartsnap
  # kubewall — Kubernetes-дашборд одним бинарником: один UI на несколько
  # кластеров (kubeconfig-файлы), просмотр и правка ресурсов, логи, exec,
  # события — без установки чего-либо в сам кластер. Релиз —
  # kubewall_Linux_x86_64.tar.gz, бинарник kubewall в корне.
  - name: kubewall
    source: github
    repo: kubewall/kubewall
    url: "https://github.com/kubewall/kubewall/releases/download/{tag}/kubewall_Linux_x86_64.tar.gz"
    archive: tar
    member: kubewall
  # kubevpn — VPN в Kubernetes: поднимает локальный tun-интерфейс, через который
  # поды кластера (и сервисы, и headless-сервисы) видны как соседи в локальной
  # сети — без port-forward на каждый порт. Для локальной разработки против
  # удалённого кластера. Релиз — zip kubevpn_v{version}_linux_amd64.zip,
  # бинарник внутри bin/kubevpn.
  - name: kubevpn
    source: github
    repo: kubenetworks/kubevpn
    url: "https://github.com/kubenetworks/kubevpn/releases/download/{tag}/kubevpn_v{version}_linux_amd64.zip"
    archive: zip
    member: bin/kubevpn
  # netfetch — сканирует кластер и находит ворклоады, не покрытые NetworkPolicy
  # (открытые настежь поды и сервисы), с разбивкой по namespace. Релиз —
  # netfetch_{version}_linux_amd64.tar.gz, бинарник лежит в каталоге
  # netfetch_{version}_linux_amd64/.
  - name: netfetch
    source: github
    repo: deggja/netfetch
    url: "https://github.com/deggja/netfetch/releases/download/{tag}/netfetch_{version}_linux_amd64.tar.gz"
    archive: tar
    member: netfetch_{version}_linux_amd64/netfetch
  # timoni — пакетный менеджер Kubernetes на CUE: модули описывают ресурсы
  # типизированно, с проверками и значениями, а timoni применяет их как
  # helm-релиз (install/upgrade/delete). Альтернатива Helm для CUE-стека.
  # Релиз — timoni_{version}_linux_amd64.tar.gz, бинарник timoni в корне.
  - name: timoni
    source: github
    repo: stefanprodan/timoni
    url: "https://github.com/stefanprodan/timoni/releases/download/{tag}/timoni_{version}_linux_amd64.tar.gz"
    archive: tar
    member: timoni
  # kubeview — визуализация ресурсов кластера и связей между ними: граф
  # объектов (deployments → pods → services) в браузере, одним бинарником,
  # без установки чего-либо в кластер. Одиночный бинарник kubeview-linux-amd64.
  - name: kubeview
    source: github
    repo: benc-uk/kubeview
    url: "https://github.com/benc-uk/kubeview/releases/download/{tag}/kubeview-linux-amd64"
    archive: none
  # kubehound — построение путей атак в Kubernetes: собирает граф ролей,
  # подов, секретов и нод и ищет цепочки доступа к привилегиям. Бинарник
  # kubehound-Linux-x86_64 (заглавные буквы в имени) — кладём как kubehound.
  - name: kubehound
    source: github
    repo: DataDog/KubeHound
    url: "https://github.com/DataDog/KubeHound/releases/download/{tag}/kubehound-Linux-x86_64"
    archive: none
  # charts-syncer — синхронизация Helm-репозиториев: переносит чарты между
  # реестрами (в т.ч. OCI), умеет инкрементально и по расписанию — для
  # зеркал и air-gapped контуров. Релиз — charts-syncer_{version}_linux_x86_64.tar.gz,
  # бинарник charts-syncer в корне.
  - name: charts-syncer
    source: github
    repo: bitnami/charts-syncer
    url: "https://github.com/bitnami/charts-syncer/releases/download/{tag}/charts-syncer_{version}_linux_x86_64.tar.gz"
    archive: tar
    member: charts-syncer
  # netobserv — сетевая наблюдаемость Kubernetes на eBPF без агента в
  # кластере: `netobserv` сам собирает потоки, DNS и метрики и показывает их
  # в терминале/веб-UI. В тарболле бинарник лежит по пути build/netobserv,
  # на диск кладём под именем команды — netobserv.
  - name: netobserv
    source: github
    repo: netobserv/netobserv-cli
    url: "https://github.com/netobserv/netobserv-cli/releases/download/{tag}/netobserv-cli.tar.gz"
    archive: tar
    member: build/netobserv
  # capacitor — UI для FluxCD: показывает состояние GitOps-репозиториев,
  # kustomization и helm-релизов без установки чего-либо в кластер (читает
  # kubeconfig и CRD Flux). Одиночный бинарник next-Linux-x86_64 (так
  # называется артефакт релиза) — кладём как capacitor.
  - name: capacitor
    source: github
    repo: gimlet-io/capacitor
    url: "https://github.com/gimlet-io/capacitor/releases/download/{tag}/next-Linux-x86_64"
    archive: none
  # kubeconform — валидация манифестов по схемам OpenAPI без кластера и без
  # GitHub API: подтягивает схемы встроенных типов и CRD (или берёт локальные),
  # понимает Kustomize/Helm-вывод и multi-doc YAML. Замена kubectl apply
  # --dry-run в CI. Релиз — kubeconform-linux-amd64.tar.gz, бинарник в корне.
  - name: kubeconform
    source: github
    repo: yannh/kubeconform
    url: "https://github.com/yannh/kubeconform/releases/download/{tag}/kubeconform-linux-amd64.tar.gz"
    archive: tar
    member: kubeconform
  # kube-linter — статический анализ манифестов на антипаттерны: нет probes,
  # requests/limits, securityContext, устаревшие API, опасно широкие RBAC.
  # Дополняет kubeconform (схемы) и pluto (removed API): здесь — best practices.
  # Релиз — kube-linter-linux.tar.gz, бинарник kube-linter в корне.
  - name: kube-linter
    source: github
    repo: stackrox/kube-linter
    url: "https://github.com/stackrox/kube-linter/releases/download/{tag}/kube-linter-linux.tar.gz"
    archive: tar
    member: kube-linter
  # helmfile — декларативное описание набора Helm-релизов в helmfile.yaml:
  # окружения, зависимости, values из нескольких источников, diff перед
  # применением (`helmfile diff`) и sync. Сам helm в плейбуке уже есть; helmfile
  # становится над ним. Релиз — helmfile_{version}_linux_amd64.tar.gz.
  - name: helmfile
    source: github
    repo: helmfile/helmfile
    url: "https://github.com/helmfile/helmfile/releases/download/{tag}/helmfile_{version}_linux_amd64.tar.gz"
    archive: tar
    member: helmfile
  # kind — Kubernetes IN Docker: локальный кластер в контейнерах одной командой
  # (`kind create cluster`), референсная реализация для тестов манифестов и
  # CI. Одиночный бинарник kind-linux-amd64 без версии в имени.
  - name: kind
    source: github
    repo: kubernetes-sigs/kind
    url: "https://github.com/kubernetes-sigs/kind/releases/download/{tag}/kind-linux-amd64"
    archive: none

  # --- Из подборки collabnix/kubetools (TODO-kubetools.md) ------------------
  # kops — установка, обновление и управление production-кластерами Kubernetes
  # (AWS, GCE, OpenStack и др.). Одиночный бинарник kops-linux-amd64.
  - name: kops
    source: github
    repo: kubernetes/kops
    url: "https://github.com/kubernetes/kops/releases/download/{tag}/kops-linux-amd64"
    archive: none
  # devpod — client-only окружения разработки по devcontainer.json на любом
  # бэкенде (локальный Docker, SSH, Kubernetes). Одиночный бинарник.
  - name: devpod
    source: github
    repo: loft-sh/devpod
    url: "https://github.com/loft-sh/devpod/releases/download/{tag}/devpod-linux-amd64"
    archive: none
  # kompose — конвертация docker-compose.yml в манифесты Kubernetes/OpenShift.
  - name: kompose
    source: github
    repo: kubernetes/kompose
    url: "https://github.com/kubernetes/kompose/releases/download/{tag}/kompose-linux-amd64"
    archive: none
  # ko — сборка Go-образов без Docker и деплой в Kubernetes с резолвом в digest.
  - name: ko
    source: github
    repo: google/ko
    url: "https://github.com/google/ko/releases/download/{tag}/ko_{version}_Linux_x86_64.tar.gz"
    archive: tar
    member: ko
  # kubie — изолированные kubeconfig по shell/каталогу, рекурсивное чтение
  # контекстов и запуск команд в нужном кластере. Одиночный бинарник.
  - name: kubie
    source: github
    repo: kubie-org/kubie
    url: "https://github.com/kubie-org/kubie/releases/download/{tag}/kubie-linux-amd64"
    archive: none
  # kubefwd — массовый port-forward сервисов namespace с выдачей IP и записей
  # в /etc/hosts. В архиве бинарник kubefwd в корне.
  - name: kubefwd
    source: github
    repo: txn2/kubefwd
    url: "https://github.com/txn2/kubefwd/releases/download/{tag}/kubefwd_Linux_x86_64.tar.gz"
    archive: tar
    member: kubefwd
  # kubectl-tree — плагин kubectl: дерево объектов по ownerReferences
  # (Deployment → ReplicaSet → Pod). Имя с префиксом даёт `kubectl tree`.
  # В имени артефакта версия с префиксом v (kubectl-tree_v0.6.0_...), поэтому
  # в URL подставляем {tag}, а не {version}.
  - name: kubectl-tree
    source: github
    repo: ahmetb/kubectl-tree
    url: "https://github.com/ahmetb/kubectl-tree/releases/download/{tag}/kubectl-tree_{tag}_linux_amd64.tar.gz"
    archive: tar
    member: kubectl-tree
  # conftest — тесты конфигов (YAML/JSON/HCL/Dockerfile) политиками Rego/OPA.
  - name: conftest
    source: github
    repo: open-policy-agent/conftest
    url: "https://github.com/open-policy-agent/conftest/releases/download/{tag}/conftest_{version}_Linux_x86_64.tar.gz"
    archive: tar
    member: conftest
  # kube-bench — проверка кластера по CIS Kubernetes Benchmark.
  - name: kube-bench
