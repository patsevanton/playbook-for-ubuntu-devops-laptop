---
# ============================================================================
# Роль shell: удобные утилиты командной строки и файл окружения.
# Пакеты — из репозитория Ubuntu, бинарники — актуальные версии.
# ============================================================================
shell_packages:
  - eza
  - zoxide
  - fzf
  - ripgrep
  - fd-find
  # fontconfig даёт fc-cache — им обновляется кэш шрифтов (Nerd Font ниже).
  - fontconfig

shell_binaries:
  - name: starship
    source: github
    repo: starship/starship
    url: "https://github.com/starship/starship/releases/download/{tag}/starship-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: starship
  - name: bat
    source: github
    repo: sharkdp/bat
    url: "https://github.com/sharkdp/bat/releases/download/{tag}/bat-v{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: bat-v{version}-x86_64-unknown-linux-gnu/bat
  # difftastic — структурный diff: понимает синтаксис языка (а не строки).
  # Релиз — тарболл с одиночным бинарником difft.
  - name: difftastic
    source: github
    repo: Wilfred/difftastic
    url: "https://github.com/Wilfred/difftastic/releases/download/{tag}/difft-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: difft
  # delta — улучшенный просмотр git-diff (side-by-side, подсветка). В архиве
  # бинарник лежит в каталоге delta-{version}-x86_64-unknown-linux-gnu.
  - name: delta
    source: github
    repo: dandavison/delta
    url: "https://github.com/dandavison/delta/releases/download/{tag}/delta-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: delta-{version}-x86_64-unknown-linux-gnu/delta
  # gdu — быстрый анализатор занятого места на диске с интерактивным TUI.
  # Релиз — gdu_linux_amd64.tgz (gzip-тарболл), бинарник внутри gdu_linux_amd64.
  - name: gdu
    source: github
    repo: dundee/gdu
    url: "https://github.com/dundee/gdu/releases/download/{tag}/gdu_linux_amd64.tgz"
    archive: tar
    member: gdu_linux_amd64
  # zellij — терминальный мультиплексор (сессии/вкладки/панели) с плагинами.
  # Релиз — zellij-x86_64-unknown-linux-musl.tar.gz, бинарник внутри zellij.
  - name: zellij
    source: github
    repo: zellij-org/zellij
    url: "https://github.com/zellij-org/zellij/releases/download/{tag}/zellij-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: zellij
  # navi — интерактивные шпаргалки команд поверх fzf. Релиз —
  # navi-v{version}-x86_64-unknown-linux-musl.tar.gz, бинарник внутри ./navi.
  - name: navi
    source: github
    repo: denisidoro/navi
    url: "https://github.com/denisidoro/navi/releases/download/{tag}/navi-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: navi
  # fx — интерактивный просмотрщик и обработчик JSON (одиночный бинарник).
  # Тег релиза без префикса v (40.0.0), бинарник fx_linux_amd64.
  - name: fx
    source: github
    repo: antonmedv/fx
    url: "https://github.com/antonmedv/fx/releases/download/{tag}/fx_linux_amd64"
    archive: none
  # hl — быстрый просмотрщик и процессор логов (JSON/logfmt).
  # Релиз — hl-linux-x86_64-gnu.tar.gz (glibc-сборка под Ubuntu), бинарник hl.
  - name: hl
    source: github
    repo: pamburus/hl
    url: "https://github.com/pamburus/hl/releases/download/{tag}/hl-linux-x86_64-gnu.tar.gz"
    archive: tar
    member: hl
  # mcfly — умная история команд: ctrl-r с приоритизацией по контексту
  # (каталог, недавние команды, частота, код выхода) поверх SQLite. Выбран
  # вместо atuin, который конфликтовал с VTE (баг GNOME/vte#2951 — см.
  # not-install.md). Релиз — тарболл
  # mcfly-v{version}-x86_64-unknown-linux-musl (glibc-сборки нет, только
  # musl/статическая), бинарник лежит в корне архива.
  - name: mcfly
    source: github
    repo: cantino/mcfly
    url: "https://github.com/cantino/mcfly/releases/download/{tag}/mcfly-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: mcfly
  # dust — наглядный du: дерево каталогов с размером и графиком, быстрее du.
  # Бинарник в каталоге dust-v{version}-x86_64-unknown-linux-musl.
  - name: dust
    source: github
    repo: bootandy/dust
    url: "https://github.com/bootandy/dust/releases/download/{tag}/dust-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: dust-v{version}-x86_64-unknown-linux-musl/dust

bashrc_path: "{{ home_dir }}/.bashrc"
bashrc_marker: "# {mark} DEVOPS PLAYBOOK (ansible role: shell)"

# --- Nerd Font: JetBrainsMono Nerd Font -------------------------------------
# Starship рисует глифы ветки Git и Kubernetes из private use area, eza --icons
# — иконки файлов; в обычных шрифтах таких глифов нет — без них в терминале
# видны «квадратики». Ставим полное семейство JetBrainsMono Nerd Font
# (все начертания, ~7 МБ) в пользовательский каталог шрифтов, без sudo.
# После установки в терминале можно выбрать «JetBrainsMono Nerd Font» —
# иконки уже внутри шрифта.
nerd_font_install: true
nerd_font_version: v3.5.1
nerd_font_family: JetBrainsMono
nerd_font_dir: "{{ home_dir }}/.local/share/fonts/JetBrainsMono"
# Первое начертание — маркер идемпотентности: есть файл — ничего не качаем.
nerd_font_marker: JetBrainsMonoNerdFont-Regular.ttf
# Распаковка идёт без sudo, поэтому staging — в домашнем каталоге,
# а не в общем tmp_dir (он принадлежит root).
nerd_font_staging_dir: "{{ home_dir }}/.cache/devops-jetbrains-mono"
nerd_font_url: "https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_font_version }}/{{ nerd_font_family }}.tar.xz"

# --- M-Commander: двухпанельный файловый менеджер ---------------------------
# Форк GNU Midnight Commander с плагинами (git, docker, Kubernetes, S3,
# FTP/SFTP, Samba, systemd) и встроенным редактором/вьюером/терминалом.
# Ставится официальными .deb из GitHub-релиза, сборка под Ubuntu 26.04.
# Версия — последний релиз (редирект releases/latest). Пакеты системные,
# поэтому задачи внутри mcommander.yml идут с become.
mcommander_install: true
mcommander_repo: blue-panels/mcommander
# Пакеты релиза: базовый + plugins + lua (у plugins/lua зависимость от
# базового пакета той же версии, поэтому ставятся одной транзакцией).
mcommander_deb_packages:
  - mcommander
  - mcommander-plugins
  - mcommander-lua
# Суффикс имени артефакта после версии: в имени файла дистрибутив идёт с
# точками (mcommander_6.1.0-1.ubuntu26.04.1_amd64.deb).
mcommander_deb_suffix: "-1.ubuntu26.04.1_amd64.deb"
mcommander_deb_dir: "{{ tmp_dir }}/mcommander"
