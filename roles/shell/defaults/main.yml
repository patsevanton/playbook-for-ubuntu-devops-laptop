---
# ============================================================================
# Роль shell: удобные утилиты командной строки и файл окружения.
# Пакеты — из репозитория Ubuntu, бинарники — актуальные версии.
# ============================================================================
shell_packages:
  - eza
  - zoxide
  - fzf
  - ripgrep
  - fd-find
  # poppler-utils даёт pdftotext/pdfinfo — через них rga ищет текст внутри PDF.
  - poppler-utils
  # fontconfig даёт fc-cache — им обновляется кэш шрифтов (Nerd Font ниже).
  - fontconfig
  # shellcheck — статический анализ shell-скриптов на ошибки и баги.
  - shellcheck
  # duf — `df` «для людей»: таблица дисков и точек монтирования с занятым и
  # свободным местом, цветной вывод, фильтры по типу ФС.
  - duf
  # btop — монитор ресурсов (CPU, память, диски, сеть, процессы) с графиками
  # и мышью: замена top/htop. В apt 26.04 — 1.4.6.
  - btop
  # ncdu — интерактивный анализ занятого места на диске с навигацией по
  # каталогам и удалением прямо из TUI.
  - ncdu
  # ttyd — веб-терминал, через который vhs запускает запись; ffmpeg —
  # кодировщик, в который vhs отдаёт кадры (без него vhs не соберёт видео).
  - ttyd
  - ffmpeg
  # ghostty — терминал на Zig: нативный GTK4-интерфейс (окна, табы, сплиты),
  # OpenGL-рендер, kitty graphics protocol, terminfo xterm-ghostty в комплекте.
  # В Ubuntu 26.04 пакет есть в universe (1.3.0~us1) — отдельный .deb или snap
  # не нужен. Апстрим выпускает только tip-сборки macOS и исходники, готового
  # linux-amd64 бинарника в релизах нет, поэтому apt здесь единственный путь.
  - ghostty
  # moreutils — небольшие утилиты для пайплайнов: sponge (пишет в файл только
  # после полного чтения stdin, спасает `jq ... file > file`), ts (метки
  # времени), vidir (правка имён каталога в $EDITOR), ifne (запуск только при
  # непустом stdin), chronic (вывод только при ошибке), pee (разветвление
  # stdin в несколько команд).
  - moreutils
  # GNU parallel — параллельное выполнение команд с контролем числа задач,
  # прогрессом и повторами; замена циклам и `xargs -P` там, где нужны
  # аргументы, логи и единый вывод.
  - parallel
  # lnav — просмотрщик логов с SQL по содержимому: автодетект формата,
  # таймлайн, фильтры, переходы по ошибкам. Дополняет toolong и hl: у lnav
  # уникальны SQL-запросы и разбор смешанных форматов.
  - lnav
  # ioping — замер отзывчивости дисковой подсистемы: латентность I/O, а не
  # объём. Дополняет duf/gdu/ncdu, которые показывают занятое место.
  - ioping

shell_binaries:
  - name: starship
    source: github
    repo: starship/starship
    url: "https://github.com/starship/starship/releases/download/{tag}/starship-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: starship
  - name: bat
    source: github
    repo: sharkdp/bat
    url: "https://github.com/sharkdp/bat/releases/download/{tag}/bat-v{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: bat-v{version}-x86_64-unknown-linux-gnu/bat
  # rga (ripgrep-all) — ripgrep, который ищет внутри PDF, EPUB, docx и других
  # Office-документов, архивов (zip, tar.gz) и баз SQLite: адаптеры вытаскивают
  # текст и отдают его тому же ripgrep, поэтому синтаксис и флаги привычные.
  # PDF разбирает pdftotext из poppler-utils (пакетом выше), видео — ffmpeg,
  # остальное — встроенными адаптерами. rga запускает вспомогательный
  # rga-preproc, поэтому ставим оба бинарника из одного тарболла.
  - name: rga
    source: github
    repo: phiresky/ripgrep-all
    url: "https://github.com/phiresky/ripgrep-all/releases/download/{tag}/ripgrep_all-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: ripgrep_all-v{version}-x86_64-unknown-linux-musl/rga
  - name: rga-preproc
    source: github
    repo: phiresky/ripgrep-all
    url: "https://github.com/phiresky/ripgrep-all/releases/download/{tag}/ripgrep_all-v{version}-x86_64-unknown-linux-musl.tar.gz"
    archive: tar
    member: ripgrep_all-v{version}-x86_64-unknown-linux-musl/rga-preproc
  # difftastic — структурный diff: понимает синтаксис языка (а не строки).
  # Релиз — тарболл с одиночным бинарником difft.
  - name: difftastic
    source: github
    repo: Wilfred/difftastic
    url: "https://github.com/Wilfred/difftastic/releases/download/{tag}/difft-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: difft
  # delta — улучшенный просмотр git-diff (side-by-side, подсветка). В архиве
  # бинарник лежит в каталоге delta-{version}-x86_64-unknown-linux-gnu.
  - name: delta
    source: github
    repo: dandavison/delta
    url: "https://github.com/dandavison/delta/releases/download/{tag}/delta-{version}-x86_64-unknown-linux-gnu.tar.gz"
    archive: tar
    member: delta-{version}-x86_64-unknown-linux-gnu/delta
  # gdu — быстрый анализатор занятого места на диске с интерактивным TUI.
  # Релиз — gdu_linux_amd64.tgz (gzip-тарболл), бинарник внутри gdu_linux_amd64.
  - name: gdu
    source: github
    repo: dundee/gdu
    url: "https://github.com/dundee/gdu/releases/download/{tag}/gdu_linux_amd64.tgz"
    archive: tar
    member: gdu_linux_amd64
  # zellij — терминальный мультиплексор (сессии/вкладки/панели) с плагинами.
