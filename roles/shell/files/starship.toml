add_newline = true

[custom.git_remote_url]
description = 'Remote git repository'
when = 'git rev-parse --is-inside-work-tree'
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
GIT_REMOTE_URL=$(echo $GIT_REMOTE | sed -E 's/^https?:\\/\\/(.+@)?//; s/\\.git$//; s/.+@(.*):(.*)$/\\1\\/\\2/; s/\\/$//')
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ -n "$GIT_REMOTE" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL$GIT_REMOTE_URL"
"""
# Default format is according to the segmented-brackets preset (https://github.com/starship/starship/pull/2747)
format = '\[[$output](bold $style)\]'
# If you prefer the default Starship style, use the following
#format = "at [$output]($style)"
shell = ["bash", "--noprofile", "--norc"]
style = '#dfff00'

[directory]
truncation_length = 30


[helm]
format = "via [ $version](bold purple) "
disabled = true

[hostname]
ssh_only = false
format =  "on [$hostname](bold blue)@"
disabled = false

[kubernetes]
format = 'on [☸ $context \($namespace\)](dimmed yellow) '
disabled = false

[memory_usage]
threshold = 75
format = 'via $symbol[$ram( | $swap)]($style) '
style = 'white bold dimmed'
symbol = '🐏 '
disabled = false

[time]
format = '[$time]($style)'
style = 'bold fg:202'
use_12hr = false
disabled = false
utc_time_offset = 'local'
time_range = '-'
time_format = '%T %d/%m'

