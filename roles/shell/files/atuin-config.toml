# ~/.atuin/config.toml
# Конфиг atuin — история команд shell поверх SQLite: fuzzy-поиск, статистика.
# Файл управляется Ansible (роль shell) — ручные правки будут перезаписаны.
# Меняйте roles/shell/files/atuin-config.toml в репозитории; путь назначения
# задаётся переменной atuin_config_file в group_vars/all.yml.
#
# Полный список настроек и значения по умолчанию:
#   https://docs.atuin.sh/configuration/config/
# (пример конфига: crates/atuin-client/config.toml в репозитории atuinsh/atuin).

# --- Синхронизация ----------------------------------------------------------
# История живёт только локально (SQLite в ~/.atuin): автоматическая
# синхронизация выключена, к серверу atuin ничего не уходит.
# Чтобы синхронизировать историю между машинами: `atuin register` (или
# `atuin login`) и затем auto_sync = true — либо разово `atuin sync`.
auto_sync = false

# Проверять наличие новой версии не нужно: обновления идут через плейбук
# (удалите /usr/local/bin/atuin и запустите плейбук снова).
update_check = false

# --- Поиск -----------------------------------------------------------------
# fuzzy — нечёткий поиск по всей истории команд.
search_mode = "fuzzy"
# Начальный фильтр: global — вся история, независимо от хоста, сессии
# и каталога. Альтернативы: host, session, session-preload, directory,
# workspace (команды внутри одного git-репозитория).
filter_mode = "global"

# --- Безопасность ----------------------------------------------------------
# Не сохранять в историю команды, похожие на секреты: AWS key id, GitHub PAT,
# Slack tokens/webhooks, Stripe keys (встроенный набор regex).
secrets_filter = true

# --- Поведение -------------------------------------------------------------
# Enter сразу выполняет выбранную команду, Tab кладёт её в строку для правки.
enter_accept = true

# Не сохранять команды, подпадающие под regex (пример — команды с паролями
# и токенами в аргументах):
# history_filter = [
#   "^.*--(password|passwd|token|secret)[= ].*$",
# ]
# Не сохранять историю из каталогов (например, с секретами):
# cwd_filter = [
#   "^/very/secret/area",
# ]
