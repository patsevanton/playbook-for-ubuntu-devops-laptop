---
# ============================================================================
# Роль skills: глобальные skills для opencode (каталог ~/.agents/skills).
#
# Skills ставятся CLI `skills` (npm-пакет skills) командой `npx skills add`
# с флагами `-g -y -a opencode`: глобально для пользователя, без вопросов,
# в каталог агента opencode. CLI сам клонирует git-репозитории источников,
# поэтому для установки нужны git и npm (роли git и runtimes).
#
# Идемпотентность: перед установкой читается lock-файл CLI
# (~/.agents/.skill-lock.json) и источники, чьи skills уже установлены,
# пропускаются. Удалить запись из lock-файла = переустановить.
#
# Список skills_sources — реплика рабочего окружения (skills из
# ~/.agents/.skill-lock.json рабочей машины). Источники — SSH-URL GitHub
# (требуется SSH-ключ к GitHub на целевой машине), как в lock-файле.
# Не берутся skills из tt-a1i/archify (archify, archify-review) — по
# решению от 2026-10-18.
# ============================================================================

# Каталог глобальных skills и lock-файл CLI `skills`.
skills_dir: "{{ home_dir }}/.agents/skills"
skills_lock_file: "{{ home_dir }}/.agents/.skill-lock.json"

# Агент, для которого ставятся skills (флаг -a у CLI `skills`).
skills_agent: opencode

# Источники skills: git-репозиторий и перечень имён skills из него
# (флаг -s у CLI `skills`). Всего:
# 68 skills из 16 репозиториев.
