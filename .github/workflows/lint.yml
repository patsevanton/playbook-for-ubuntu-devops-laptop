---
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint и синтаксис
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установить линтеры
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Проверить синтаксис playbook.yml
        run: ansible-playbook --syntax-check playbook.yml

      - name: Проверить, что роли и теги разбираются
        run: ansible-playbook --list-tasks playbook.yml > /dev/null

      - name: ansible-lint
        run: ansible-lint

      - name: yamllint
        run: yamllint -c .yamllint .
