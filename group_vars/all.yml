---
# ============================================================================
# Общие переменные проекта (применяются ко всем хостам).
#
# Версии инструментов НЕ фиксируются: ставится актуальное на момент запуска.
# Исключение — то, что вы задаёте сами через tfenv/tgenv (см. README).
# ============================================================================

# --- Пользователь и пути ----------------------------------------------------
user_name: "{{ ansible_facts['user_id'] }}"
home_dir: "{{ ansible_facts['env']['HOME'] }}"
# Куда кладутся скачанные бинарники.
bin_dir: /usr/local/bin
# Временный каталог для загрузок и распаковки.
tmp_dir: /var/tmp/devops-install
# Файл окружения, который подключается из ~/.bashrc.
shell_file: "{{ home_dir }}/.config/devops-shell.sh"
# Конфиг starship (тема prompt); starship читает его по этому пути по умолчанию.
starship_config_file: "{{ home_dir }}/.config/starship.toml"

# --- Поведение --------------------------------------------------------------
# User-Agent для запросов к GitHub / npm / HashiCorp.
http_user_agent: "ansible-devops-playbook"
